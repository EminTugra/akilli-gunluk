<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#8a5873">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Akıllı Günlük">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./akilli-gunluk.webmanifest">
  <link rel="apple-touch-icon" href="./akilli-gunluk-icon.svg">
  <title>Akıllı Günlük</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=Google+Sans+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --primary: #8a5873;
      --on-primary: #ffffff;
      --primary-container: #f4dce8;
      --on-primary-container: #341523;
      --secondary: #58616a;
      --secondary-container: #dde4ea;
      --on-secondary-container: #151d24;
      --tertiary: #6f5862;
      --tertiary-container: #f1dfe7;
      --warning: #8d4e00;
      --warning-container: #ffdcc0;
      --success: #176d38;
      --success-container: #a3f5b8;
      --error: #ba1a1a;
      --error-container: #ffdad6;
      --surface: #f7f9f8;
      --surface-low: #f0f4f2;
      --surface-container: #e9eeec;
      --surface-high: #dfe6e3;
      --surface-highest: #d4ddda;
      --on-surface: #141918;
      --on-surface-variant: #485452;
      --outline: #73807d;
      --outline-variant: #c3ceca;
      --scrim: rgba(0, 0, 0, .42);
      --shadow: 0 16px 42px rgba(16, 28, 30, .14);
      --soft-shadow: 0 8px 24px rgba(16, 28, 30, .1);
      --font-display: "Google Sans", "Google Sans Text", system-ui, sans-serif;
      --font-body: "Google Sans Text", "Google Sans", system-ui, sans-serif;
      --ease-standard: cubic-bezier(.2, 0, 0, 1);
      --ease-emphasized: cubic-bezier(.2, 0, 0, 1);
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
      --duration-short: 160ms;
      --duration-medium: 320ms;
      --duration-long: 520ms;
      --rail-width: 86px;
      --topbar-height: 78px;
      --radius-xs: 12px;
      --radius-sm: 16px;
      --radius-md: 22px;
      --radius-lg: 28px;
      --radius-xl: 34px;
      --radius-pill: 999px;
      --spacing: 16px;
      --bottom-nav-height: 82px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #e5b7cc;
        --on-primary: #4e2637;
        --primary-container: #5f3447;
        --on-primary-container: #f4dce8;
        --secondary: #c1c9d0;
        --secondary-container: #333b42;
        --on-secondary-container: #e6edf2;
        --tertiary: #d8bec8;
        --tertiary-container: #4c3942;
        --warning: #ffb875;
        --warning-container: #653900;
        --success: #88d99d;
        --success-container: #005321;
        --error: #ffb4ab;
        --error-container: #93000a;
        --surface: #0f1413;
        --surface-low: #141a19;
        --surface-container: #1b2220;
        --surface-high: #252d2b;
        --surface-highest: #303936;
        --on-surface: #e1e7e4;
        --on-surface-variant: #c0cbc7;
        --outline: #8b9692;
        --outline-variant: #414d49;
        --scrim: rgba(0, 0, 0, .62);
        --shadow: 0 18px 46px rgba(0, 0, 0, .36);
        --soft-shadow: 0 10px 28px rgba(0, 0, 0, .24);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --primary: var(--light-primary, #8a5873);
      --on-primary: #ffffff;
      --primary-container: var(--light-primary-container, #f4dce8);
      --on-primary-container: var(--light-on-primary-container, #341523);
      --secondary: #58616a;
      --secondary-container: #dde4ea;
      --on-secondary-container: #151d24;
      --tertiary: #6f5862;
      --tertiary-container: #f1dfe7;
      --warning: #8d4e00;
      --warning-container: #ffdcc0;
      --success: #176d38;
      --success-container: #a3f5b8;
      --error: #ba1a1a;
      --error-container: #ffdad6;
      --surface: #f7f9f8;
      --surface-low: #f0f4f2;
      --surface-container: #e9eeec;
      --surface-high: #dfe6e3;
      --surface-highest: #d4ddda;
      --on-surface: #141918;
      --on-surface-variant: #485452;
      --outline: #73807d;
      --outline-variant: #c3ceca;
      --scrim: rgba(0, 0, 0, .42);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: var(--dark-primary, #e5b7cc);
      --on-primary: #4e2637;
      --primary-container: var(--dark-primary-container, #5f3447);
      --on-primary-container: var(--dark-on-primary-container, #f4dce8);
      --secondary: #c1c9d0;
      --secondary-container: #333b42;
      --on-secondary-container: #e6edf2;
      --tertiary: #d8bec8;
      --tertiary-container: #4c3942;
      --warning: #ffb875;
      --warning-container: #653900;
      --success: #88d99d;
      --success-container: #005321;
      --error: #ffb4ab;
      --error-container: #93000a;
      --surface: #0f1413;
      --surface-low: #141a19;
      --surface-container: #1b2220;
      --surface-high: #252d2b;
      --surface-highest: #303936;
      --on-surface: #e1e7e4;
      --on-surface-variant: #c0cbc7;
      --outline: #8b9692;
      --outline-variant: #414d49;
      --scrim: rgba(0, 0, 0, .62);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--surface);
      color: var(--on-surface);
      font-family: var(--font-body);
      letter-spacing: 0;
    }

    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
    }

    .material-symbols-rounded {
      font-variation-settings: "FILL" 0, "wght" 600, "GRAD" 0, "opsz" 24;
      font-size: 24px;
      line-height: 1;
      pointer-events: none;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 1fr;
      width: 100%;
      height: 100%;
      background: var(--surface);
    }

    .top-app-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: var(--topbar-height);
      padding: 14px clamp(14px, 3vw, 28px);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: saturate(1.05) blur(14px);
      border-bottom: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
    }

    body[data-view="onboarding"] .top-app-bar,
    body[data-view="editor"] .top-app-bar,
    body[data-view="entrySetup"] .top-app-bar,
    body[data-view="momentPicker"] .top-app-bar,
    body[data-view="viewer"] .top-app-bar {
      display: none;
    }

    .title-stack {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 2px;
      font-size: 12px;
      font-weight: 700;
      color: color-mix(in srgb, var(--primary) 82%, var(--on-surface));
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(20px, 2.4vw, 28px);
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .view-host {
      height: 100%;
      overflow: auto;
      padding: calc(var(--topbar-height) + 22px) clamp(16px, 4vw, 44px) calc(var(--bottom-nav-height) + 34px);
      scroll-behavior: smooth;
    }

    body[data-view="onboarding"] .view-host,
    body[data-view="editor"] .view-host,
    body[data-view="entrySetup"] .view-host,
    body[data-view="momentPicker"] .view-host,
    body[data-view="viewer"] .view-host {
      padding-top: 0;
      padding-bottom: 0;
    }

    .view {
      width: min(1180px, 100%);
      margin: 0 auto;
      animation: viewIn var(--duration-medium) var(--ease-emphasized);
    }

    @keyframes viewIn {
      from {
        transform: translateY(16px) scale(.985);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .icon-button,
    .filled-button,
    .tonal-button,
    .text-button,
    .chip,
    .menu-item,
    .fab,
    .toolbar-button,
    .segmented-button,
    .switch,
    .entry-card,
    .suggestion-card,
    .setting-row,
    .vault-tile {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      cursor: pointer;
      transition:
        transform var(--duration-short) var(--ease-spring),
        border-radius var(--duration-short) var(--ease-standard),
        background var(--duration-short) var(--ease-standard),
        box-shadow var(--duration-short) var(--ease-standard),
        opacity var(--duration-short) var(--ease-standard);
    }

    .icon-button:active,
    .filled-button:active,
    .tonal-button:active,
    .text-button:active,
    .chip:active,
    .menu-item:active,
    .fab:active,
    .toolbar-button:active,
    .segmented-button:active,
    .entry-card:active,
    .suggestion-card:active,
    .setting-row:active,
    .vault-tile:active {
      transform: scale(.96);
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 18px;
      background: transparent;
      color: var(--on-surface);
    }

    .icon-button:hover,
    .toolbar-button:hover {
      background: var(--surface-high);
      border-radius: 22px;
    }

    .icon-button.prominent {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .filled-button,
    .tonal-button,
    .text-button {
      min-height: 46px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: var(--radius-pill);
      font-weight: 750;
      white-space: nowrap;
    }

    .filled-button {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--soft-shadow);
    }

    .filled-button:hover {
      box-shadow: var(--shadow);
    }

    .tonal-button {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .text-button {
      background: transparent;
      color: var(--primary);
      padding-inline: 14px;
    }

    .text-button:hover {
      background: color-mix(in srgb, var(--primary-container) 52%, transparent);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .home-more {
      display: none;
    }

    body[data-view="entries"] .home-more,
    body[data-view="suggestions"] .home-more {
      display: inline-grid;
    }

    .save-top {
      display: none;
    }

    body[data-view="editor"] .save-top {
      display: inline-flex;
    }

    .sidebar-scrim {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      background: var(--scrim);
      transition: opacity var(--duration-medium) var(--ease-standard);
    }

    .sidebar,
    .sidebar-scrim {
      display: none !important;
    }

    .sidebar-scrim.open {
      pointer-events: auto;
      opacity: 1;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 70;
      width: min(372px, calc(100vw - 24px));
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--outline-variant);
      border-radius: 0 var(--radius-xl) var(--radius-xl) 0;
      box-shadow: var(--shadow);
      transform: translateX(-104%);
      transition: transform var(--duration-long) var(--ease-emphasized);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-head {
      padding: 24px 18px 18px;
      display: grid;
      gap: 16px;
      border-bottom: 1px solid var(--outline-variant);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: var(--surface-high);
      color: var(--primary);
      border: 1px solid var(--outline-variant);
      box-shadow: var(--soft-shadow);
    }

    .brand-text strong {
      display: block;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 850;
    }

    .brand-text span {
      display: block;
      margin-top: 3px;
      color: var(--on-surface-variant);
      font-size: 13px;
    }

    .profile-chip {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 22px;
      background: var(--surface-container);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      font-weight: 850;
      text-transform: uppercase;
    }

    .profile-chip .name {
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-chip .mail {
      margin-top: 2px;
      color: var(--on-surface-variant);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-list {
      flex: 1;
      overflow: auto;
      padding: 12px;
    }

    .menu-section-label {
      margin: 14px 12px 8px;
      font-size: 12px;
      color: var(--on-surface-variant);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .menu-item {
      width: 100%;
      min-height: 52px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 14px;
      margin: 4px 0;
      padding: 0 14px;
      border-radius: 18px;
      background: transparent;
      color: var(--on-surface);
      text-align: left;
      font-weight: 720;
    }

    .menu-item:hover {
      background: var(--surface-container);
    }

    .menu-item.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-radius: 28px;
    }

    .menu-item .lock-dot {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: color-mix(in srgb, var(--secondary-container) 72%, transparent);
      color: var(--on-secondary-container);
    }

    .sidebar-foot {
      padding: 12px;
      border-top: 1px solid var(--outline-variant);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 44;
      width: 100%;
      min-height: calc(64px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      padding: 6px 10px max(6px, env(safe-area-inset-bottom));
      border-radius: 0;
      background: var(--surface);
      border-top: 1px solid color-mix(in srgb, var(--outline-variant) 78%, transparent);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, .06);
      backdrop-filter: none;
    }

    .bottom-nav-item {
      min-width: 0;
      display: grid;
      grid-template-rows: 32px 16px;
      place-items: center;
      gap: 4px;
      border-radius: 18px;
      background: transparent;
      color: var(--on-surface-variant);
      font-size: 11px;
      font-weight: 800;
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    .bottom-nav-item::before {
      content: "";
      grid-row: 1;
      grid-column: 1;
      width: 58px;
      height: 30px;
      border-radius: var(--radius-pill);
      background: var(--primary-container);
      opacity: 0;
      transform: scale(.72);
      transition: opacity var(--duration-short) var(--ease-standard), transform var(--duration-medium) var(--ease-spring);
    }

    .bottom-nav-item .material-symbols-rounded {
      grid-row: 1;
      grid-column: 1;
      z-index: 1;
      font-size: 22px;
      font-variation-settings: "FILL" 0, "wght" 650, "GRAD" 0, "opsz" 24;
    }

    .bottom-nav-item > span:last-child {
      grid-row: 2;
      grid-column: 1;
      z-index: 1;
      line-height: 1;
    }

    .bottom-nav-item.active {
      background: transparent;
      color: var(--on-surface);
    }

    .bottom-nav-item.active::before {
      opacity: 1;
      transform: scale(1);
    }

    .bottom-nav-item.active .material-symbols-rounded {
      color: var(--on-primary-container);
      font-variation-settings: "FILL" 1, "wght" 700, "GRAD" 0, "opsz" 24;
    }

    body.platform-ios .bottom-nav {
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      backdrop-filter: saturate(1.35) blur(24px);
    }

    body[data-view="onboarding"] .bottom-nav,
    body[data-view="editor"] .bottom-nav,
    body[data-view="entrySetup"] .bottom-nav,
    body[data-view="momentPicker"] .bottom-nav,
    body[data-view="viewer"] .bottom-nav {
      display: none;
    }

    .entries-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(16px, 3vw, 28px);
      align-items: start;
    }

    .entry-list {
      display: grid;
      gap: 14px;
    }

    .entry-list.grid-mode {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .selection-toolbar {
      position: sticky;
      top: calc(var(--topbar-height) + 10px);
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 26px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 68%, transparent);
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(18px);
    }

    .select-dot {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-pill);
      border: 2px solid color-mix(in srgb, var(--outline) 72%, transparent);
      color: transparent;
      background: color-mix(in srgb, var(--surface) 82%, transparent);
    }

    .entry-preview-card.selected-entry .select-dot {
      color: var(--on-primary);
      background: var(--primary);
      border-color: var(--primary);
    }

    .entry-swipe {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      touch-action: pan-y;
    }

    .entry-swipe-actions {
      position: absolute;
      inset: 0 0 0 auto;
      width: 178px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      align-items: stretch;
      padding: 8px;
      background: transparent;
    }

    .entry-swipe-action {
      display: grid;
      place-items: center;
      gap: 4px;
      border-radius: 22px;
      background: var(--surface-high);
      color: var(--on-surface);
      font-size: 12px;
      font-weight: 850;
    }

    .entry-swipe-action.delete {
      background: var(--error-container);
      color: var(--error);
    }

    .entry-swipe-front {
      position: relative;
      z-index: 2;
      width: 100%;
      transform: translateX(var(--swipe-x, 0px));
      transition: transform var(--duration-medium) var(--ease-emphasized);
    }

    .entry-swipe.dragging .entry-swipe-front {
      transition: none;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .section-head h2 {
      font-family: var(--font-display);
      font-size: clamp(28px, 4.2vw, 44px);
      line-height: 1.02;
      font-weight: 850;
      letter-spacing: 0;
    }

    .section-head p,
    .muted {
      color: var(--on-surface-variant);
    }

    .entry-card {
      width: 100%;
      min-height: 136px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      padding: 18px;
      border-radius: var(--radius-lg);
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 68%, transparent);
      text-align: left;
    }

    .entry-card:hover {
      border-radius: 34px;
      box-shadow: var(--soft-shadow);
      background: var(--surface-high);
    }

    .entry-card h3 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 820;
      line-height: 1.1;
      margin-bottom: 9px;
      word-break: break-word;
    }

    .entry-card p {
      color: var(--on-surface-variant);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      user-select: text;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--surface-highest) 82%, transparent);
      color: var(--on-surface-variant);
      font-size: 13px;
      font-weight: 700;
    }

    .chip .material-symbols-rounded {
      font-size: 17px;
    }

    .date-pill {
      display: grid;
      place-items: center;
      width: 68px;
      height: 74px;
      border-radius: 26px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-weight: 850;
      line-height: 1;
    }

    .date-pill small {
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .date-pill span {
      font-size: 26px;
    }

    .overview-panel {
      display: grid;
      gap: 12px;
      position: sticky;
      top: calc(var(--topbar-height) + 24px);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric-tile,
    .empty-state,
    .panel {
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 68%, transparent);
      border-radius: var(--radius-lg);
    }

    .metric-tile {
      min-height: 118px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-tile strong {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 850;
      line-height: 1;
    }

    .metric-tile span {
      color: var(--on-surface-variant);
      font-weight: 700;
      font-size: 13px;
    }

    .metric-tile.wide {
      grid-column: 1 / -1;
      min-height: 150px;
      background: var(--surface-high);
      color: var(--on-surface);
      border-color: color-mix(in srgb, var(--primary) 32%, var(--outline-variant));
    }

    .metric-tile.wide span {
      color: var(--on-surface-variant);
    }

    .mini-bars {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      align-items: end;
      gap: 4px;
      height: 44px;
      margin-top: 18px;
    }

    .mini-bars i {
      display: block;
      min-height: 5px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 52%, var(--surface-highest));
      transform-origin: bottom;
      animation: barIn var(--duration-medium) var(--ease-spring) both;
    }

    @keyframes barIn {
      from {
        transform: scaleY(.2);
        opacity: .4;
      }
      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .empty-state {
      min-height: 330px;
      display: grid;
      place-items: center;
      padding: 42px 24px;
      text-align: center;
    }

    .empty-state .big-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 30px;
      color: var(--on-primary-container);
      background: var(--primary-container);
      box-shadow: var(--soft-shadow);
    }

    .empty-state h2 {
      font-family: var(--font-display);
      font-size: 30px;
      margin-bottom: 8px;
    }

    .onboarding-view {
      min-height: 100vh;
      width: min(780px, 100%);
      margin: 0 auto;
      padding: max(34px, env(safe-area-inset-top)) clamp(22px, 5vw, 44px) max(24px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 26px;
    }

    .onboarding-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-dots {
      display: flex;
      gap: 7px;
    }

    .progress-dots i {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--outline-variant);
      transition: width var(--duration-medium) var(--ease-emphasized), background var(--duration-short) var(--ease-standard);
    }

    .progress-dots i.active {
      width: 28px;
      background: var(--primary);
    }

    .onboarding-main {
      align-self: center;
      display: grid;
      gap: 24px;
    }

    .soft-illustration {
      width: min(280px, 72vw);
      aspect-ratio: 1 / .72;
      margin: 0 auto;
      position: relative;
      border-radius: 44px;
      background: var(--primary-container);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 20%, transparent);
    }

    .soft-illustration::before,
    .soft-illustration::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 72%, var(--surface));
      animation: floatShape 4.8s var(--ease-emphasized) infinite alternate;
    }

    .soft-illustration::before {
      width: 92px;
      height: 92px;
      left: 44px;
      bottom: 38px;
    }

    .soft-illustration::after {
      width: 142px;
      height: 42px;
      right: 36px;
      bottom: 38px;
      animation-delay: 320ms;
    }

    .soft-illustration .shape-a,
    .soft-illustration .shape-b {
      position: absolute;
      background: color-mix(in srgb, var(--on-primary-container) 68%, transparent);
      border-radius: 18px;
    }

    .soft-illustration .shape-a {
      width: 38px;
      height: 102px;
      left: 132px;
      top: 50px;
      transform: rotate(10deg);
    }

    .soft-illustration .shape-b {
      width: 104px;
      height: 18px;
      right: 44px;
      top: 72px;
      transform: rotate(-4deg);
    }

    @keyframes floatShape {
      from {
        transform: translateY(0) scale(1);
      }
      to {
        transform: translateY(-7px) scale(1.02);
      }
    }

    .onboarding-copy {
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .onboarding-copy h2 {
      font-family: var(--font-display);
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.02;
      font-weight: 850;
    }

    .onboarding-copy p {
      color: var(--on-surface-variant);
      font-size: 17px;
      line-height: 1.5;
    }

    .interest-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .interest-card {
      position: relative;
      overflow: hidden;
      min-height: 166px;
      display: grid;
      align-content: space-between;
      gap: 12px;
      padding: 16px;
      border-radius: 30px;
      background: color-mix(in srgb, var(--primary-container) 52%, var(--surface-container));
      border: 1px solid transparent;
      text-align: left;
    }

    .interest-card.selected {
      border-color: color-mix(in srgb, var(--primary) 45%, transparent);
      background: color-mix(in srgb, var(--primary-container) 76%, var(--surface));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 16%, transparent);
    }

    .interest-art {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      color: var(--primary);
      background: color-mix(in srgb, var(--surface) 58%, transparent);
    }

    .interest-art .material-symbols-rounded {
      font-size: 34px;
      transition: transform var(--duration-medium) var(--ease-spring), font-variation-settings var(--duration-short) var(--ease-standard);
    }

    .interest-card:hover .interest-art .material-symbols-rounded,
    .interest-card.selected .interest-art .material-symbols-rounded {
      transform: translateY(-3px) rotate(-4deg) scale(1.08);
      font-variation-settings: "FILL" 1, "wght" 720, "GRAD" 0, "opsz" 32;
    }

    .interest-card::after {
      content: "";
      position: absolute;
      inset: auto 18px 18px auto;
      width: 26px;
      height: 8px;
      border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--primary) 38%, transparent);
      opacity: 0;
      transform: scaleX(.5);
      transform-origin: right center;
      transition: opacity var(--duration-short) var(--ease-standard), transform var(--duration-medium) var(--ease-spring);
    }

    .interest-card:hover::after,
    .interest-card.selected::after {
      opacity: .8;
      transform: scaleX(1);
    }

    .interest-card strong {
      font-size: 17px;
      font-weight: 850;
    }

    .permission-list {
      display: grid;
      gap: 10px;
    }

    .permission-item {
      min-height: 78px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: 26px;
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 64%, transparent);
    }

    .permission-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--surface-high);
      color: var(--primary);
    }

    .onboarding-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .onboarding-actions .filled-button,
    .onboarding-actions .tonal-button,
    .onboarding-actions .text-button {
      min-height: 58px;
      border-radius: 24px;
    }

    .fab {
      position: fixed;
      left: auto;
      right: clamp(20px, 4vw, 42px);
      bottom: calc(var(--bottom-nav-height) + max(22px, env(safe-area-inset-bottom)));
      z-index: 45;
      width: 62px;
      min-height: 62px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 24px;
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: 0 10px 28px color-mix(in srgb, var(--primary) 22%, transparent);
      font-weight: 800;
      font-size: 0;
      white-space: nowrap;
    }

    .fab:hover {
      border-radius: 32px;
      box-shadow: 0 14px 34px color-mix(in srgb, var(--primary) 28%, transparent);
    }

    body:not([data-view="entries"]) .fab,
    body[data-view="onboarding"] .fab {
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px) scale(.92);
    }

    .fab .plus-disc {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: transparent;
    }

    .fab > span:last-child {
      display: none;
    }

    .editor-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(290px, 380px);
      gap: clamp(18px, 4vw, 32px);
      align-items: start;
    }

    .pixel-page {
      min-height: 100vh;
      width: min(760px, 100%);
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) clamp(18px, 5vw, 38px) max(20px, env(safe-area-inset-bottom));
      display: grid;
      gap: 18px;
      align-content: start;
      background: var(--surface);
    }

    .pixel-toolbar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .pixel-toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pixel-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: color-mix(in srgb, var(--surface-high) 72%, transparent);
      color: var(--on-surface-variant);
    }

    .pixel-icon.active {
      color: var(--primary);
      background: var(--primary-container);
    }

    .save-pill {
      min-height: 42px;
      padding: 0 18px;
      border-radius: 18px;
      background: color-mix(in srgb, var(--on-surface) 84%, var(--surface));
      color: var(--surface);
      font-weight: 850;
    }

    .journal-date-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--on-surface-variant);
      font-size: 14px;
      font-weight: 700;
    }

    .journal-date-line .material-symbols-rounded {
      font-size: 17px;
    }

    .pixel-title-input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--on-surface);
      font-family: var(--font-display);
      font-size: clamp(32px, 9vw, 58px);
      line-height: 1.02;
      font-weight: 720;
      letter-spacing: 0;
    }

    .pixel-body-input {
      width: 100%;
      min-height: 38vh;
      border: 0;
      outline: none;
      resize: vertical;
      background: transparent;
      color: var(--on-surface);
      font-size: var(--editor-font-size, 18px);
      line-height: 1.72;
      user-select: text;
    }

    .prompt-sheet {
      margin-top: auto;
      margin-inline: calc(-1 * clamp(18px, 5vw, 38px));
      border-radius: 34px 34px 0 0;
      background: color-mix(in srgb, var(--surface-low) 88%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--outline-variant) 68%, transparent);
      border-bottom: 0;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, .06);
      overflow: hidden;
    }

    .attached-photos {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: minmax(88px, 15vw);
      gap: 8px;
      padding: 2px 0 4px;
    }

    .attached-photo {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: var(--surface-high);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 70%, transparent);
    }

    .attached-photo.featured {
      grid-column: span 2;
      grid-row: span 2;
    }

    .attached-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-photo-button,
    .photo-meta-chip {
      position: absolute;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      color: var(--on-surface);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 58%, transparent);
      backdrop-filter: blur(14px);
      box-shadow: var(--soft-shadow);
    }

    .remove-photo-button {
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      justify-content: center;
    }

    .remove-photo-button .material-symbols-rounded {
      font-size: 19px;
    }

    .photo-meta-chip {
      left: 8px;
      bottom: 8px;
      max-width: calc(100% - 16px);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .subject-badge {
      position: absolute;
      left: 76%;
      top: 20%;
      min-width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      padding: 0 8px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      color: var(--primary);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 64%, transparent);
      font-weight: 900;
      box-shadow: var(--soft-shadow);
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      margin: 12px auto 10px;
      border-radius: 999px;
      background: var(--outline-variant);
    }

    .prompt-card {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 14px clamp(18px, 5vw, 38px) 12px;
    }

    .prompt-card p {
      color: var(--on-surface-variant);
      line-height: 1.45;
      font-size: 14px;
    }

    .prompt-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 8px clamp(18px, 5vw, 38px) 14px;
    }

    .prompt-tab {
      min-height: 40px;
      border-radius: 18px;
      background: transparent;
      color: var(--on-surface-variant);
      font-size: 13px;
      font-weight: 800;
    }

    .prompt-tab.active {
      background: var(--surface-high);
      color: var(--on-surface);
    }

    .cover-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .cover-option {
      min-height: 142px;
      border-radius: 30px;
      padding: 14px;
      display: grid;
      align-content: end;
      text-align: left;
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
      background: var(--surface-container);
    }

    .cover-option.selected {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .cover-art,
    .entry-cover {
      position: relative;
      overflow: hidden;
      background: var(--surface-high);
    }

    .cover-art::before,
    .entry-cover::before {
      content: "";
      position: absolute;
      inset: auto 14% 18% 14%;
      height: 26%;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 46%, var(--surface));
    }

    .cover-art::after,
    .entry-cover::after {
      content: "";
      position: absolute;
      width: 22%;
      aspect-ratio: 1;
      left: 28%;
      top: 26%;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 72%, var(--surface));
    }

    .cover-art {
      min-height: 104px;
      margin-bottom: 10px;
      border-radius: 24px;
    }

    .cover-art.cover-sport::before,
    .entry-cover.cover-sport::before {
      height: 8px;
      inset: auto 12% 30% 12%;
      background: color-mix(in srgb, var(--primary) 42%, var(--surface));
    }

    .cover-art.cover-sport::after,
    .entry-cover.cover-sport::after {
      left: 38%;
      top: 22%;
      width: 26%;
      box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--on-primary-container) 34%, transparent);
    }

    .cover-art.cover-travel::before,
    .entry-cover.cover-travel::before {
      inset: auto 18% 20% 18%;
      height: 36%;
      border-radius: 18px 18px 999px 999px;
    }

    .cover-art.cover-calm::after,
    .entry-cover.cover-calm::after {
      width: 40%;
      left: 32%;
      top: 24%;
      border-radius: 42% 58% 46% 54%;
    }

    .cover-art.cover-creative::before,
    .entry-cover.cover-creative::before {
      transform: rotate(-8deg);
    }

    .entry-preview-card {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 30px;
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 68%, transparent);
      text-align: left;
    }

    .entry-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 26px;
    }

    .entry-cover.photo-cover,
    .cover-art.photo-cover {
      background-size: cover;
      background-position: center;
      border-color: color-mix(in srgb, var(--outline-variant) 62%, transparent);
    }

    .entry-cover.photo-cover::before,
    .entry-cover.photo-cover::after,
    .cover-art.photo-cover::before,
    .cover-art.photo-cover::after {
      display: none;
    }

    .reflection-box {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border-radius: 22px;
      background: var(--surface-low);
    }

    .viewer-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 8vw, 56px);
      line-height: 1.04;
      font-weight: 780;
    }

    .viewer-body {
      color: var(--on-surface);
      font-size: 18px;
      line-height: 1.78;
      white-space: pre-wrap;
      user-select: text;
    }

    .editor-main {
      display: grid;
      gap: 16px;
    }

    .suggestion-strip {
      display: grid;
      gap: 12px;
    }

    .strip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .strip-header h2 {
      font-size: 18px;
      font-weight: 850;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .suggestion-card {
      min-height: 154px;
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
      background: var(--surface-container);
      display: grid;
      gap: 12px;
      text-align: left;
    }

    .suggestion-card.selected {
      background: color-mix(in srgb, var(--primary-container) 58%, var(--surface-container));
      color: var(--on-surface);
      border-color: color-mix(in srgb, var(--primary) 45%, var(--outline-variant));
      border-radius: 30px;
    }

    .suggestion-card .thumb {
      width: 100%;
      aspect-ratio: 16 / 8;
      border-radius: 22px;
      background: var(--surface-high);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .suggestion-card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .suggestion-card h3 {
      font-size: 18px;
      font-weight: 850;
      line-height: 1.18;
    }

    .suggestion-card p {
      color: color-mix(in srgb, currentColor 72%, transparent);
      line-height: 1.45;
      font-size: 14px;
    }

    .suggestion-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .moment-page {
      min-height: 100vh;
      width: min(760px, 100%);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) clamp(14px, 4vw, 30px) max(22px, env(safe-area-inset-bottom));
      display: grid;
      gap: 14px;
      align-content: start;
      background: var(--surface);
      transform-origin: calc(100% - 52px) calc(100% - 52px);
      animation: momentOpen var(--duration-long) var(--ease-emphasized);
    }

    @keyframes momentOpen {
      from {
        opacity: .15;
        transform: translateY(18px) scale(.72);
        border-radius: 42px;
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        border-radius: 0;
      }
    }

    .moment-card-list {
      display: grid;
      gap: 10px;
    }

    .moment-card {
      min-height: 136px;
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 12px;
      padding: 10px;
      border-radius: 28px;
      background: var(--surface-container);

    .moment-card .thumb {

      border-radius: 22px;
      overflow: hidden;

      place-items: center;
      background: var(--surface-high);
    }

    .moment-card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .moment-source-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .source-pill {
      min-height: 58px;
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 24px;
      background: color-mix(in srgb, var(--surface-container) 76%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--outline-variant) 62%, transparent);
      text-align: left;
      font-weight: 800;
    }

    .mention-panel {

      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 0 0;
    }

    .mention-panel.open {
      display: flex;
    }

    .mention-chip {
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--primary-container) 76%, var(--surface));
      color: var(--primary);
      font-weight: 850;
    }

    .mention-name {
      color: #2f6fcb;
      font-weight: 850;
    }

    .editor-surface {
      display: grid;
      gap: 14px;
      padding: 16px;
      border-radius: 34px;
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
    }

    .title-input,
    .body-input,
    .form-field input,
    .form-field textarea,
    .form-field select,
    .inline-field {
      width: 100%;
      border: 1px solid var(--outline-variant);
      outline: none;
      background: var(--surface);
      color: var(--on-surface);
      transition: border var(--duration-short) var(--ease-standard), box-shadow var(--duration-short) var(--ease-standard), background var(--duration-short) var(--ease-standard);
    }

    .title-input:focus,
    .body-input:focus,
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus,
    .inline-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent);
    }

    .title-input {
      min-height: 68px;
      padding: 10px 14px;
      border-radius: 24px;
      font-family: var(--font-display);
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 850;
      letter-spacing: 0;
    }

    .body-input {
      min-height: 48vh;
      resize: vertical;
      padding: 18px;
      border-radius: 28px;
      font-size: var(--editor-font-size, 18px);
      line-height: 1.72;
      user-select: text;
    }

    .editor-toolbar {
      position: static;
      z-index: 12;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 6px;
      display: flex;
      justify-content: flex-start;
      gap: 6px;
      overflow-x: auto;
      border-radius: 22px;
      background: var(--surface-high);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 78%, transparent);
      box-shadow: none;
    }

    .toolbar-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--on-surface);
      background: transparent;
      flex: 0 0 auto;
    }

    .toolbar-button.primary {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .editor-side {
      display: grid;
      gap: 12px;
      position: sticky;
      top: calc(var(--topbar-height) + 22px);
    }

    .panel {
      padding: 16px;
    }

    .panel h3 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 850;
      margin-bottom: 10px;
    }

    .panel p {
      color: var(--on-surface-variant);
      line-height: 1.48;
      margin-bottom: 12px;
    }

    .side-actions {
      display: grid;
      gap: 8px;
    }

    .side-actions .tonal-button,
    .side-actions .filled-button,
    .side-actions .text-button {
      width: 100%;
    }

    .ai-status {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 22px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-weight: 800;
      animation: statusPulse 1.1s var(--ease-standard) infinite alternate;
    }

    .ai-status.active {
      display: flex;
    }

    @keyframes statusPulse {
      from {
        transform: scale(.99);
        opacity: .82;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .insights-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .insight-card {
      min-height: 160px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: var(--radius-lg);
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 68%, transparent);
      transition: transform var(--duration-medium) var(--ease-spring), border-radius var(--duration-medium) var(--ease-standard), opacity var(--duration-medium) var(--ease-standard), filter var(--duration-medium) var(--ease-standard);
    }

    .insight-card:nth-child(1) {
      grid-column: span 2;
      grid-row: span 2;
      min-height: 334px;
      color: var(--on-surface);
      background: var(--surface-high);
      border-color: color-mix(in srgb, var(--primary) 28%, var(--outline-variant));
    }

    .insight-card:nth-child(4) {
      grid-column: span 2;
      background: color-mix(in srgb, var(--warning-container) 34%, var(--surface-container));
      color: var(--on-surface);
    }

    .insight-card:nth-child(5) {
      background: color-mix(in srgb, var(--secondary-container) 48%, var(--surface-container));
      color: var(--on-surface);
    }

    .insight-card h3 {
      font-family: var(--font-display);
      font-size: clamp(34px, 5vw, 78px);
      line-height: .95;
      font-weight: 850;
    }

    .insight-card span {
      font-weight: 800;
      color: color-mix(in srgb, currentColor 72%, transparent);
    }

    .insights-grid.has-expanded .insight-card:not(.expanded) {
      transform: scale(.94);
      opacity: .46;
      filter: saturate(.5);
    }

    .insight-card.expanded {
      transform: scale(1.03);
      border-radius: 38px;
      box-shadow: var(--shadow);
      z-index: 2;
    }

    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .location-card,
    .photo-card,
    .people-card,
    .card-card,
    .update-card {
      display: grid;
      gap: 12px;
      min-height: 180px;
      padding: 16px;
      border-radius: var(--radius-lg);
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 22px;
      background: var(--surface-high);
    }

    .card-title {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title h3 {
      font-size: 19px;
      font-weight: 850;
      line-height: 1.15;
    }

    .small-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .vault-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .vault-tile {

      height: 48px;

      place-items: center;

      background: var(--primary-container);
      color: var(--on-primary-container);
      font-size: 28px;
    }

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-field {
      display: grid;
      gap: 7px;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      font-size: 13px;
      font-weight: 800;
      color: var(--on-surface-variant);
    }

    .form-field input,
    .form-field textarea,
    .form-field select,
    .inline-field {
      min-height: 48px;
      padding: 11px 14px;
      border-radius: 17px;
    }

    .form-field textarea {
      resize: vertical;
      min-height: 96px;
    }

    .settings-list {
      display: grid;
      gap: 10px;
    }

    .setting-card {
      border-radius: var(--radius-lg);
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 0fr;
      transition: grid-template-rows var(--duration-medium) var(--ease-emphasized), border-radius var(--duration-short) var(--ease-standard), background var(--duration-short) var(--ease-standard);
    }

    .setting-card.open {
      grid-template-rows: auto 1fr;
      border-radius: 32px;
      background: color-mix(in srgb, var(--surface-high) 55%, var(--surface-container));

      grid-template-columns: 48px minmax(0, 1fr) auto;

    .setting-row h3 {
      font-size: 17px;
      font-weight: 850;
      margin-bottom: 4px;
    }

    .setting-row p {
      color: var(--on-surface-variant);
      line-height: 1.35;
      font-size: 14px;
    }

    .setting-detail {
      overflow: hidden;
      min-height: 0;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity var(--duration-medium) var(--ease-standard), transform var(--duration-medium) var(--ease-emphasized);
    }

    .setting-card.open .setting-detail {
      opacity: 1;
      transform: translateY(0);

    .setting-detail-inner {
      overflow: hidden;
      min-height: 0;
      padding: 0 16px 18px 78px;

    @keyframes detailIn {
      from {
        transform: translateY(-8px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .setting-controls .full {
      grid-column: 1 / -1;
    }

    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      padding: 4px;
      border-radius: 22px;
      background: var(--surface-high);
      border: 1px solid var(--outline-variant);
    }

    .segmented-button {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 18px;
      background: transparent;
      color: var(--on-surface-variant);
      font-weight: 800;
      white-space: nowrap;

    .segmented-button.active {

    .switch-row {
      display: flex;

    .switch-row span {

      height: 34px;

    .switch.on {

      background: var(--on-primary);

    .color-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

    .swatch.active {
      border-color: var(--on-surface);
      transform: scale(1.08);
    }

    .dialog-layer {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      place-items: center;
      padding: 18px;
      background: var(--scrim);
    }

    .anchor-menu-layer {
      position: fixed;
      inset: 0;
      z-index: 92;
      display: none;
      background: transparent;
    }

    .anchor-menu-layer.open {
      display: block;
    }

    .anchor-menu {
      position: fixed;
      width: min(340px, calc(100vw - 22px));
      max-height: calc(100vh - 20px);

    .anchor-menu-section:last-child {

      margin-bottom: 0;
      padding-bottom: 0;
    }

    .anchor-menu-label {
      padding: 8px 26px 10px;
      color: var(--on-surface-variant);
      font-weight: 720;
    }

    .anchor-menu-item {
      width: calc(100% - 20px);
      margin: 0 10px;
      min-height: 58px;
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 22px;
      background: transparent;
      color: var(--on-surface);
      text-align: left;
      font-weight: 800;
    }

    .anchor-menu-item:hover {
      background: var(--surface-highest);
    }

    .anchor-menu-item .material-symbols-rounded {
      color: var(--primary);
    }

    body.platform-ios .anchor-menu {
      border-radius: 32px;
      background: color-mix(in srgb, var(--surface) 72%, transparent);
      backdrop-filter: saturate(1.55) blur(28px);
      box-shadow: 0 20px 52px rgba(0, 0, 0, .22);
    }

    .dialog-layer.open {
      display: grid;
      animation: fadeIn var(--duration-short) var(--ease-standard);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .dialog {
      width: min(540px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      border-radius: 34px;
      padding: 22px;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--surface) 82%, transparent), color-mix(in srgb, var(--surface-high) 74%, transparent)),
        var(--surface);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
      box-shadow: 0 26px 70px rgba(0, 0, 0, .34);
      backdrop-filter: blur(26px) saturate(1.25);
      animation: dialogIn var(--duration-medium) var(--ease-spring);
    }

    @keyframes dialogIn {
      from {
        transform: translateY(22px) scale(.94);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .dialog-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dialog-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 850;
      line-height: 1.15;
    }

    .dialog-title .material-symbols-rounded {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .dialog-content {
      display: grid;
      gap: 14px;
      color: var(--on-surface-variant);
      line-height: 1.5;
    }

    .dialog-content strong {
      color: var(--on-surface);
    }

    .dialog-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toast-stack {
      position: fixed;
      left: 50%;
      bottom: 94px;
      z-index: 120;
      display: grid;
      gap: 8px;
      width: min(460px, calc(100vw - 28px));
      transform: translateX(-50%);
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 16px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--surface-highest) 88%, transparent);
      color: var(--on-surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.2);

    @keyframes toastIn {
      from {
        transform: translateY(18px) scale(.94);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .hidden-input {
      display: none;
    }

    .ripple {
      position: absolute;
      z-index: -1;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      pointer-events: none;
      background: color-mix(in srgb, currentColor 18%, transparent);
      transform: translate(-50%, -50%) scale(0);
      animation: ripple var(--duration-long) var(--ease-standard);
    }

    @keyframes ripple {
      to {
        transform: translate(-50%, -50%) scale(22);
        opacity: 0;
      }
    }

    body.reduce-motion *,
    body.reduce-motion *::before,
    body.reduce-motion *::after {
      animation-duration: 1ms !important;
      transition-duration: 1ms !important;
      scroll-behavior: auto !important;
    }

    body[data-density="compact"] {
      --spacing: 12px;
      --topbar-height: 68px;
    }

    body[data-density="compact"] .entry-card,
    body[data-density="compact"] .panel,
    body[data-density="compact"] .location-card,
    body[data-density="compact"] .photo-card,
    body[data-density="compact"] .people-card,
    body[data-density="compact"] .card-card,
    body[data-density="compact"] .update-card {
      border-radius: 20px;
      padding: 13px;
    }

    @media (max-width: 940px) {
      .entries-layout,
      .editor-layout {
        grid-template-columns: 1fr;
      }

      .overview-panel,
      .editor-side {
        position: static;
      }

      .suggestion-grid,
      .setting-controls,
      .form-grid,
      .interest-grid,
      .cover-grid {
        grid-template-columns: 1fr;
      }

      .vault-grid {
        grid-template-columns: 1fr;
      }

      .insights-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      }

      }

      }

      .view-host {
        padding-inline: 14px;
      }

      .entry-list.grid-mode {
        grid-template-columns: 1fr;

    ];

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return cloneState(defaultState);
        const parsed = JSON.parse(saved);
        const merged = mergeDeep(cloneState(defaultState), parsed);
        if ((parsed.version || 0) < 7) {
          merged.onboarding.completed = false;
          merged.onboarding.step = 0;
        }
        return merged;
      } catch (error) {
        console.warn(error);
        return cloneState(defaultState);
      }
    }

    function cloneState(value) {
      if (typeof structuredClone === "function") return structuredClone(value);
      return JSON.parse(JSON.stringify(value));
    }

    function mergeDeep(target, source) {
      if (!source || typeof source !== "object") return target;
      Object.keys(source).forEach((key) => {
        if (source[key] && typeof source[key] === "object" && !Array.isArray(source[key])) {
          target[key] = mergeDeep(target[key] || {}, source[key]);
        } else {
          target[key] = source[key];
        }
      });
      return target;
    }

    function persistState() {
      state.version = defaultState.version;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderProfileMini();
    }

    function uid(prefix = "id") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value = "") {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    function highlightKnownNames(text = "") {
      let safe = escapeHtml(text);
      const names = (state.subjects || [])
        .map((subject) => subject.name)
        .filter((name) => name && name.length > 1)
        .sort((a, b) => b.length - a.length);
      names.forEach((name) => {
        const escaped = escapeHtml(name).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        safe = safe.replace(new RegExp(`\\b(${escaped})\\b`, "gi"), `<span class="mention-name">$1</span>`);
      });
      return safe;
    }

    function formatDate(dateValue, options = {}) {
      const date = new Date(dateValue);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("tr-TR", options).format(date);
    }

    function todayTitle() {
      return formatDate(new Date(), { weekday: "long", day: "numeric", month: "long" });
    }

    function wordCount(text = "") {
      return text.trim().split(/\s+/).filter(Boolean).length;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getPlatform() {
      const ua = navigator.userAgent || "";
      const touchMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      if (/iPad|iPhone|iPod/.test(ua) || touchMac) return "ios";
      if (/Android/.test(ua)) return "android";
      if (/Windows/.test(ua)) return "windows";
      return "web";
    }

    function getPlatformLabel() {
      const platform = getPlatform();
      if (platform === "ios") return "Fotoğraflar";
      if (platform === "android") return "Google Fotoğraflar";
      if (platform === "windows") return "Dosya Gezgini / Resimler";
      return "Fotoğraf seçici";
    }

    function applySettings() {
      if (state.settings.theme === "system") els.root.removeAttribute("data-theme");
      else els.root.dataset.theme = state.settings.theme;
      const palette = accentPalettes[state.settings.accent] || accentPalettes.teal;
      els.root.style.setProperty("--light-primary", palette.light[0]);
      els.root.style.setProperty("--light-primary-container", palette.light[1]);
      els.root.style.setProperty("--light-on-primary-container", palette.light[2]);
      els.root.style.setProperty("--dark-primary", palette.dark[0]);
      els.root.style.setProperty("--dark-primary-container", palette.dark[1]);
      els.root.style.setProperty("--dark-on-primary-container", palette.dark[2]);
      els.body.classList.toggle("reduce-motion", state.settings.motion === "reduced");
      els.body.classList.toggle("platform-ios", getPlatform() === "ios");
      els.body.classList.toggle("platform-windows", getPlatform() === "windows");
      els.body.classList.toggle("platform-android", getPlatform() === "android");
      els.body.dataset.density = state.settings.density;
      els.root.style.setProperty("--editor-font-size", `${state.settings.editorFontSize}px`);
      els.root.style.colorScheme = state.settings.theme === "system" ? "light dark" : state.settings.theme;
    }

    function renderProfileMini() {
      const initial = (state.profile.avatar || state.profile.name || "G").slice(0, 1).toUpperCase();
      els.profileAvatar.textContent = initial;
      els.profileNameMini.textContent = state.profile.name || "Günlük Sahibi";
      els.profileMailMini.textContent = state.profile.email || "E-posta eklenmedi";
    }

    function setHeader(title, eyebrow = todayTitle()) {
      els.headerTitle.textContent = title;
      els.headerEyebrow.textContent = eyebrow;
    }

    function showToast(message, icon = "check_circle") {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `<span class="material-symbols-rounded">${icon}</span><span>${escapeHtml(message)}</span>`;
      els.toastStack.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(12px) scale(.96)";
        setTimeout(() => toast.remove(), 220);
      }, 2900);
    }

    function addRipple(event) {
      const target = event.target.closest("button, .entry-card, .suggestion-card, .setting-row, .vault-tile");
      if (!target || target.disabled) return;
      const rect = target.getBoundingClientRect();
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.left = `${event.clientX - rect.left}px`;
      ripple.style.top = `${event.clientY - rect.top}px`;
      target.appendChild(ripple);
      ripple.addEventListener("animationend", () => ripple.remove());
    }

    function renderMenus() {

      const item = [...menuItems, ...footerItems].find((menu) => menu.id === view);
      if (item?.secure && state.settings.biometricRequired) {
        const ok = await requireBiometric(item.label);
        if (!ok) return;
      }
      if (activeView === "editor" && editorDirty) saveCurrentEntry({ silent: true });
      activeView = view;
      state.currentView = view;
      persistState();
      closeSidebar();
      render();
    }

    function render() {
      applySettings();
      els.body.dataset.view = activeView;

        cards: renderCardsView,

        settings: renderSettingsView
      };
      els.viewHost.innerHTML = (renderers[activeView] || renderEntriesView)();
      bindViewEvents();

    function computeStats() {
      const entries = state.entries;
      const words = entries.reduce((sum, entry) => sum + wordCount(entry.body), 0);
      const days = new Set(entries.map((entry) => new Date(entry.createdAt).toDateString())).size;
      const photos = state.photos.length;
      const places = state.places.length;
      const last = entries.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];
      return { entries: entries.length, words, days, photos, places, last };
    }
