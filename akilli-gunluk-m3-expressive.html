    function buildSuggestions() {
      const today = new Date();
      const items = [];
      buildInterestSuggestions().forEach((item) => items.push(item));
      buildSubjectSuggestions().forEach((item) => items.push(item));
      state.places
        .slice()
        .sort((a, b) => new Date(b.visitedAt || b.createdAt) - new Date(a.visitedAt || a.createdAt))
        .slice(0, 6)
        .forEach((place) => {
          const dateText = place.visitedAt ? formatDate(place.visitedAt, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "Yakın zaman";
          items.push({
            id: `place:${place.id}`,
            kind: "place",
            title: place.name || "Kaydedilen konum",
            detail: `${dateText} civarında burada görünüyorsun. Neler yaşadın?`,
            meta: place.source || "Konum",
            lat: place.lat,
            lng: place.lng,
            image: findPhotoNear(place)?.thumb || ""
          });
        });
      state.photos
        .slice()
        .sort((a, b) => new Date(b.takenAt || b.createdAt) - new Date(a.takenAt || a.createdAt))
        .slice(0, 4)
        .forEach((photo) => {
          items.push({
            id: `photo:${photo.id}`,
            kind: "photo",
            title: photo.placeName || photo.name || "Fotoğraftan anı",
            detail: photo.lat ? "Fotoğrafın konum bilgisi var; bu kareden bir günlük fikri çıkarabilirim." : "Bu görseli günlüğe bağlayabilirsin.",
            meta: "Görsel",
            lat: photo.lat,
            lng: photo.lng,
            image: photo.thumb
          });
        });
      if (items.length && !selectedSuggestionId) selectedSuggestionId = items[0].id;
      return items.slice(0, 6);
    }

    function buildSuggestions() {
      const items = [];
      buildDailyMomentSuggestions().forEach((item) => items.push(item));
      buildInterestSuggestions().forEach((item) => items.push(item));
      buildSubjectSuggestions().forEach((item) => items.push(item));
      state.places
        .slice()
        .sort((a, b) => new Date(b.visitedAt || b.createdAt) - new Date(a.visitedAt || a.createdAt))
        .slice(0, 6)
        .forEach((place) => {
          const dateText = place.visitedAt ? formatDate(place.visitedAt, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "Yakın zaman";
          items.push({
            id: `place:${place.id}`,
            kind: "place",
            title: place.name || "Kaydedilen konum",
            detail: `${dateText} civarında burada görünüyorsun. Neler yaşadın?`,
            meta: place.source || "Konum",
            lat: place.lat,
            lng: place.lng,
            image: findPhotoNear(place)?.thumb || ""
          });
        });
      state.photos
        .slice()
        .sort((a, b) => new Date(b.takenAt || b.createdAt) - new Date(a.takenAt || a.createdAt))
        .slice(0, 8)
        .forEach((photo) => items.push(buildPhotoSuggestion(photo)));
      state.healthWorkouts
        .slice()
        .sort((a, b) => new Date(b.startAt || b.createdAt) - new Date(a.startAt || a.createdAt))
        .slice(0, 6)
        .forEach((workout) => items.push(buildWorkoutSuggestion(workout)));
      const unique = [...new Map(items.filter(Boolean).map((item) => [item.id, item])).values()];
      const sorted = suggestionSeed ? unique.sort((a, b) => hashString(`${a.id}:${suggestionSeed}`) - hashString(`${b.id}:${suggestionSeed}`)) : unique;
      if (sorted.length && !selectedSuggestionId) selectedSuggestionId = sorted[0].id;
      return sorted.slice(0, 5);
    }

    function buildDailyMomentSuggestions() {
      const groups = new Map();
      const addToGroup = (dateValue, type, item) => {
        const date = new Date(dateValue || item.createdAt || Date.now());
        if (Number.isNaN(date.getTime())) return;
        const key = date.toISOString().slice(0, 10);
        if (!groups.has(key)) groups.set(key, { date, photos: [], places: [], workouts: [] });
        groups.get(key)[type].push(item);
      };
      state.photos.forEach((photo) => addToGroup(photo.takenAt || photo.createdAt, "photos", photo));
      state.places.forEach((place) => addToGroup(place.visitedAt || place.createdAt, "places", place));
      state.healthWorkouts.forEach((workout) => addToGroup(workout.startAt || workout.createdAt, "workouts", workout));
      return [...groups.values()]
        .sort((a, b) => b.date - a.date)
        .slice(0, 5)
        .map((group) => {
          const firstPhoto = group.photos[0];
          const firstWorkout = group.workouts[0];
          const parts = [];
          if (group.photos.length) parts.push(`${group.photos.length} görsel`);
          if (group.places.length) parts.push(`${group.places.length} yer`);
          if (group.workouts.length) parts.push(`${group.workouts.length} aktivite`);
          const title = `${formatDate(group.date, { day: "numeric", month: "long" })} anıları`;
          const detail = firstWorkout
            ? `${formatWorkoutName(firstWorkout)} yapmışsın. Aynı güne ait ${parts.join(", ") || "küçük anlar"} da var; bu günü tek bir girişe bağlayalım mı?`
            : firstPhoto
              ? buildPhotoSuggestion(firstPhoto).detail
              : `${formatDate(group.date, { day: "numeric", month: "long" })} günü için bir günlük girişi oluştur.`;
          return {
            id: `moment:${group.date.toISOString().slice(0, 10)}`,
            kind: "moment",
            title,
            detail,
            meta: parts.join(" · ") || "Günlük önerisi",
            image: firstPhoto?.thumb || "",
            date: group.date.toISOString()
          };
        });
    }

    function buildPhotoSuggestion(photo) {
      const names = (photo.subjectRegions || []).map((region) => region.name).filter(Boolean);
      const firstName = names[0] || photo.subjectName || "";
      const time = photo.takenAt ? formatDate(photo.takenAt, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "Bu karede";
      const mood = photo.moodHint || (photo.smileHint ? "gülümserken yakalanmış gibisin" : "");
      const detail = firstName
        ? `${firstName} ile ${mood || "birlikte görünüyorsun"}. O anda neler oldu?`
        : mood
          ? `${time} ${mood}. Bu anın hikayesi neydi?`
          : photo.lat
            ? `${time} çekilen bu konumlu fotoğraftan bir günlük fikri çıkarabilirim.`
            : `${time} bu görseli günlüğe bağlayabilirsin.`;
      return {
        id: `photo:${photo.id}`,
        kind: "photo",
        title: photo.placeName || firstName || photo.name || "Fotoğraftan anı",
        detail,
        meta: "Görsel",
        lat: photo.lat,
        lng: photo.lng,
        image: photo.thumb
      };
    }

    function buildWorkoutSuggestion(workout) {
      const title = formatWorkoutName(workout);
      const dateText = workout.startAt ? formatDate(workout.startAt, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "Yakın zamanda";
      const distance = workout.distanceKm ? ` ${Number(workout.distanceKm).toFixed(1)} km` : "";
      return {
        id: `workout:${workout.id}`,
        kind: "workout",
        title,
        detail: `${dateText} ${title.toLocaleLowerCase("tr-TR")}${distance} görünüyor. Koşu/yürüyüş sırasında aklından neler geçti?`,
        meta: "Sağlık",
        image: ""
      };
    }

    function formatWorkoutName(workout) {
      const type = (workout.type || "workout").toLocaleLowerCase("tr-TR");
      if (type.includes("run") || type.includes("koş")) return "Koşu";
      if (type.includes("walk") || type.includes("yürü")) return "Yürüyüş";
      if (type.includes("cycle") || type.includes("bisik")) return "Bisiklet";
      return workout.name || "Aktivite";
    }

    function hashString(value = "") {
      let hash = 0;
      for (let index = 0; index < value.length; index++) hash = ((hash << 5) - hash + value.charCodeAt(index)) | 0;
      return Math.abs(hash);
    }

    function buildSubjectSuggestions() {
      return (state.subjects || []).slice(-6).reverse().map((subject) => ({
        id: `subject:${subject.id}`,
        kind: "subject",
        title: subject.name,
        detail: `${subject.name} ile ilgili bir girişte bulun. Bugün onunla yaşadığın küçük an neydi?`,
        meta: subject.type === "person" ? "Kişi" : "Tanıdık yüz",
        image: state.photos.find((photo) => subject.photoIds?.includes(photo.id))?.thumb || ""
      }));
    }

    function buildInterestSuggestions() {
      const selected = state.profile.interests || [];
      if (!selected.length) return [];
      return selected.map((id) => {
        const interest = interestOptions.find((item) => item.id === id);
        if (!interest) return null;
        return {
          id: `interest:${interest.id}`,
          kind: "interest",
          title: interest.label,
          detail: interestPrompt(interest),
          meta: "Kişisel ilgi",
          image: ""
        };
      }).filter(Boolean);
    }

    function interestPrompt(interest) {
      const prompts = {
        sport: "Bugün bedenini hareket ettirdiğin, yürüdüğün veya sporla ilgili küçük bir an var mı?",
        creativity: "Bugün aklına gelen bir fikir, çizim, müzik ya da üretme isteği oldu mu?",
        mindfulness: "Bugün seni sakinleştiren veya durup nefes aldıran an neydi?",
        travel: "Bugün geçtiğin bir sokak, gördüğün bir yer veya aklında kalan rota neydi?",
        people: "Bugün biriyle yaptığın konuşma sana ne hissettirdi?",
        daily: "Bugünün küçük ama unutmak istemediğin ayrıntısı neydi?"
      };
      return prompts[interest.id] || "Bugün bu ilgi alanına dokunan bir şey yaşadın mı?";
    }

    function getPersonalPrompt() {
      const suggestion = getSelectedSuggestion() || buildSuggestions()[0];
      if (suggestion) return suggestion.detail;
      const interest = interestOptions.find((item) => item.id === state.profile.interests?.[0]);
      if (interest) return interestPrompt(interest);
      return "Bugün kendine saklamak isteyeceğin küçük an neydi?";
    }

    function matchInterestForText(text = "") {
      const normalized = text.toLocaleLowerCase("tr-TR");
      const selected = state.profile.interests?.length ? state.profile.interests : interestOptions.map((item) => item.id);
      return selected
        .map((id) => interestOptions.find((item) => item.id === id))
        .find((item) => item?.keywords?.some((keyword) => normalized.includes(keyword)));
    }

    function findPhotoNear(place) {
      if (!place?.lat || !place?.lng) return null;
      return state.photos.find((photo) => photo.lat && photo.lng && distanceKm(place.lat, place.lng, photo.lat, photo.lng) < 1.2);
    }

    function distanceKm(lat1, lng1, lat2, lng2) {
      const earth = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return earth * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function renderSuggestionCard(item) {
      const selected = selectedSuggestionId === item.id ? "selected" : "";
      const thumb = item.image
        ? `<img src="${item.image}" alt="">`

      return `

          <div>
            <div class="chip"><span class="material-symbols-rounded">${suggestionIcon(item)}</span>${escapeHtml(item.meta)}</div>
            <h3 style="margin-top:10px">${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.detail)}</p>
          </div>

          </div>
        </button>
      `;
    }

    function renderAttachedPhotos(entry) {

      return `

              ${photo.lat ? `<span class="photo-meta-chip"><span class="material-symbols-rounded" style="font-size:16px">location_on</span>${escapeHtml(photo.placeName || "Konumlu")}</span>` : ""}

    function renderPhotoSubjectBadges(photo) {
      const regions = photo.subjectRegions?.length

      return regions.map((region) => `

    function autoCoverForEntry(entry) {
      const interest = matchInterestForText(`${entry.title} ${entry.body}`);
      if (interest) return coverOptions.find((cover) => cover.interests.includes(interest.id)) || coverOptions[0];
      const profileInterest = state.profile.interests?.[0];
      return coverOptions.find((cover) => cover.interests.includes(profileInterest)) || coverOptions[0];
    }

    function markEditorDirty() {
      editorDirty = true;
      const text = document.getElementById("saveStateText");
      if (text) text.textContent = "Kaydedilmemiş değişiklik var.";
      if (state.settings.autosave) {
        clearTimeout(autosaveTimer);
        autosaveTimer = setTimeout(() => saveCurrentEntry({ silent: true, openSetup: false }), 900);
      }
    }

    function saveCurrentEntry({ silent = false, openSetup = true } = {}) {
      const titleInput = document.getElementById("entryTitleInput");
      const bodyInput = document.getElementById("entryBodyInput");
      if (!titleInput || !bodyInput) return null;
      const now = new Date().toISOString();
      const body = bodyInput.value.trim();
      const title = titleInput.value.trim() || formatDate(now, { day: "numeric", month: "long", year: "numeric" });
      let entry = getEditorEntry();
      if (!entry) {
        entry = {
          id: uid("entry"),
          title,
          body,
          createdAt: now,
          updatedAt: now,
          locations: [],
          people: [],
          cards: [],
          photos: [],
          displayName: "",
          coverStyle: "",
          setupCompleted: false
        };
        state.entries.unshift(entry);
        activeEditorId = entry.id;
      }
      entry.title = title;
      entry.body = body;
      entry.updatedAt = now;
      analyzeEntryLocally(entry);
      persistState();
      editorDirty = false;
      const text = document.getElementById("saveStateText");
      if (text) text.textContent = `Son kayıt: ${formatDate(now, { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" })}`;
      if (!silent) showToast("Günlük kaydedildi", "save");
      if (openSetup && !entry.setupCompleted) {
        entry.coverStyle = autoCoverForEntry(entry).id;
        entry.displayName = entry.title;
        persistState();
        activeView = "entrySetup";
        render();
      }
      return entry;
    }

    function analyzeEntryLocally(entry) {
      const body = `${entry.title} ${entry.body}`;
      entry.locations = state.places
        .filter((place) => place.name && body.toLocaleLowerCase("tr-TR").includes(place.name.toLocaleLowerCase("tr-TR")))
        .map((place) => place.id);
      entry.people = state.people
        .filter((person) => person.name && body.toLocaleLowerCase("tr-TR").includes(person.name.toLocaleLowerCase("tr-TR")))
        .map((person) => person.id);
      entry.cards = state.cards
        .filter((card) => card.label && body.toLocaleLowerCase("tr-TR").includes(card.label.toLocaleLowerCase("tr-TR")))
        .map((card) => card.id);
      entry.photos = state.photos
        .filter((photo) => photo.entryId === entry.id)
        .map((photo) => photo.id);
    }

    function deleteCurrentEntry() {
      if (!activeEditorId) return;
      openDialog({
        icon: "delete",
        title: "Günlük silinsin mi?",
        body: "Bu kayıt yerel hafızadan kaldırılacak.",
        actions: [
          { label: "Vazgeç", kind: "text", onClick: closeDialog },
          { label: "Sil", kind: "filled", onClick: () => {
            state.entries = state.entries.filter((entry) => entry.id !== activeEditorId);
            persistState();
            closeDialog();
            showToast("Günlük silindi", "delete");
            activeEditorId = null;
            activeView = "entries";
            render();
          }}
        ]
      });
    }

    function handleEntryQuickAction(action, entryId, source) {
      if (action === "pin") toggleEntryPinned(entryId);
      if (action === "favorite") toggleEntryFavorite(entryId);
      if (action === "delete") deleteEntryById(entryId);
      resetSwipeRows();
    }

    function toggleEntryPinned(entryId) {
      const entry = state.entries.find((item) => item.id === entryId);
      if (!entry) return;
      entry.pinned = !entry.pinned;
      entry.updatedAt = new Date().toISOString();
      persistState();
      showToast(entry.pinned ? "Günlük iğnelendi" : "İğne kaldırıldı", "push_pin");
      render();
    }

    function toggleEntryFavorite(entryId) {
      const entry = state.entries.find((item) => item.id === entryId);
      if (!entry) return;
      entry.favorite = !entry.favorite;
      entry.updatedAt = new Date().toISOString();
      persistState();
      showToast(entry.favorite ? "Favorilere eklendi" : "Favoriden çıkarıldı", "favorite");
      render();
    }

    function deleteEntryById(entryId) {
      const entry = state.entries.find((item) => item.id === entryId);
      if (!entry) return;
      state.entries = state.entries.filter((item) => item.id !== entryId);
      state.photos.forEach((photo) => {
        if (photo.entryId === entryId) photo.entryId = "";
      });
      if (activeEditorId === entryId) activeEditorId = null;
      persistState();
      showToast("Günlük silindi", "delete");
      render();
    }

    function toggleEntrySelection(entryId) {
      const selected = new Set(state.ui.selectedEntries || []);
      if (selected.has(entryId)) selected.delete(entryId);
      else selected.add(entryId);
      state.ui.selectedEntries = [...selected];
      persistState();
      render();
    }

    function bulkFavoriteSelected() {
      const selected = new Set(state.ui.selectedEntries || []);
      if (!selected.size) return showToast("Önce günlük seç", "checklist");
      state.entries.forEach((entry) => {
        if (selected.has(entry.id)) entry.favorite = true;
      });
      persistState();
      showToast("Seçilenler favorilendi", "favorite");
      render();
    }

    function bulkDeleteSelected() {

      if (!selected.size) return showToast("Önce günlük seç", "checklist");
      openDialog({
        icon: "delete",
        title: "Seçilen günlükler silinsin mi?",
        body: `${selected.size} günlük yerel hafızadan kaldırılacak.`,

            state.ui.selectionMode = false;

            closeDialog();
            showToast("Seçilenler silindi", "delete");
            render();

    async function callGemini({ input, system = "" }) {
      const bridge = getNativeBridge();
      if (state.permissions.nativeAI && bridge?.generateText) {
        const output = await bridge.generateText({ input, system });
        if (output) return String(output);
      }
      const apiKey = state.settings.apiKey.trim();
      if (!apiKey) {
        openApiKeyDialog();
        throw new Error("Gemini API anahtarı eksik.");
      }
      const model = state.settings.aiModel || "gemini-3.5-flash";
      const body = {
        model,
        input,
        system_instruction: system || `Sen bir günlük uygulamasındaki yazı asistanısın. Türkçe yaz. Ton: ${state.settings.aiTone}. Kullanıcının yerine aşırı iddialı uydurma yapma; verilen konum, fotoğraf ve metin ipuçlarından doğal günlük cümleleri öner.`,
        generation_config: {
          temperature: Number(state.settings.aiTemperature) || 0.82
        }
      };

      const response = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const detail = await response.text().catch(() => "");
        throw new Error(`Gemini isteği başarısız: ${response.status} ${detail.slice(0, 180)}`);
      }
      const data = await response.json();
      return data.output_text || extractTextFromGemini(data) || "";
    }

    function extractTextFromGemini(data) {
      if (!data) return "";
      if (typeof data.text === "string") return data.text;
      if (Array.isArray(data.steps)) {
        return data.steps.flatMap((step) => step.content || step.candidates || []).map((part) => part.text || part.output_text || "").join("\n").trim();
      }
      return "";
    }

    function setAiLoading(active) {
      const status = document.getElementById("aiStatus");
      if (status) status.classList.toggle("active", active);
    }

    function getSelectedSuggestion() {
      return buildSuggestions().find((item) => item.id === selectedSuggestionId) || null;
    }

    function buildPromptContext() {

    async function ideaForSelected(write = false) {
      const suggestion = getSelectedSuggestion();
      if (!suggestion) {
        showToast("Önce bir öneri kartı seç", "touch_app");
        return;
      }
      try {
        setAiLoading(true);
        const output = await callGemini({
          input: write
            ? `Bu olaydan kullanıcının ağzıyla kısa bir günlük girişi yaz. Sadece günlük metni olsun.\n\nOLAY:\n${JSON.stringify(suggestion, null, 2)}`
            : `Bu olay için kullanıcıya günlük yazma fikri ver: 5 maddelik kısa, kişisel ve somut öneri yaz.\n\nOLAY:\n${JSON.stringify(suggestion, null, 2)}`
        });
        if (write) {
          insertAtCursor(output.trim());
          markEditorDirty();
        } else {
          openDialog({
            icon: "lightbulb",
            title: "Bu konu için fikir",
            body: `<div style="white-space:pre-wrap; color:var(--on-surface)">${escapeHtml(output.trim())}</div>`,
            raw: true,
            actions: [

                closeDialog();
                insertAtCursor(output.trim());
                markEditorDirty();
              }},
              { label: "Kapat", kind: "text", onClick: closeDialog }
            ]

      } finally {
        setAiLoading(false);
      }
    }

    function insertAtCursor(text) {
      const body = document.getElementById("entryBodyInput");
      if (!body) return;
      const start = body.selectionStart ?? body.value.length;
      const end = body.selectionEnd ?? body.value.length;
      const spacerBefore = start && !/\s$/.test(body.value.slice(0, start)) ? "\n\n" : "";
      const spacerAfter = end < body.value.length && !/^\s/.test(body.value.slice(end)) ? "\n\n" : "";
      body.value = `${body.value.slice(0, start)}${spacerBefore}${text}${spacerAfter}${body.value.slice(end)}`;
      body.focus();
      body.selectionStart = body.selectionEnd = start + spacerBefore.length + text.length;
    }

    function updateMentionSuggestions() {
      const body = document.getElementById("entryBodyInput");
      const panel = document.getElementById("mentionPanel");
      if (!body || !panel) return;
      const cursor = body.selectionStart ?? body.value.length;
      const left = body.value.slice(0, cursor);
      const token = left.match(/(?:^|\s)([A-Za-zÇĞİÖŞÜçğıöşü]{2,})$/)?.[1] || "";
      const matches = (state.subjects || [])
        .filter((subject) => subject.name && subject.name.toLocaleLowerCase("tr-TR").startsWith(token.toLocaleLowerCase("tr-TR")) && subject.name !== token)
        .slice(0, 4);
      if (!token || !matches.length) {
        panel.classList.remove("open");
        panel.innerHTML = "";
        return;
      }
      panel.classList.add("open");
      panel.innerHTML = matches.map((subject) => `
        <button class="mention-chip" data-mention-fill="${escapeAttribute(subject.name)}">
          <span class="material-symbols-rounded" style="font-size:17px">alternate_email</span>${escapeHtml(subject.name)}
        </button>
      `).join("");
      panel.querySelectorAll("[data-mention-fill]").forEach((button) => {
        button.addEventListener("click", () => fillMention(button.dataset.mentionFill));
      });
    }

    function fillMention(name) {
      const body = document.getElementById("entryBodyInput");
      const panel = document.getElementById("mentionPanel");
      if (!body || !name) return;
      const cursor = body.selectionStart ?? body.value.length;
      const left = body.value.slice(0, cursor);
      const match = left.match(/(?:^|\s)([A-Za-zÇĞİÖŞÜçğıöşü]{2,})$/);
      if (!match) return;
      const start = cursor - match[1].length;
      body.value = `${body.value.slice(0, start)}${name}${body.value.slice(cursor)}`;
      body.focus();
      body.selectionStart = body.selectionEnd = start + name.length;
      panel?.classList.remove("open");
      markEditorDirty();
    }

    function bindViewEvents() {
      els.viewHost.querySelectorAll("[data-entry-id]").forEach((button) => {
        button.addEventListener("click", () => openEntry(button.dataset.entryId));
      });
      els.viewHost.querySelectorAll("[data-entry-view-id]").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.suppressClick === "1") {
            button.dataset.suppressClick = "0";
            return;
          }
          viewEntry(button.dataset.entryViewId);
        });
      });
      els.viewHost.querySelectorAll("[data-entry-quick]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          handleEntryQuickAction(button.dataset.entryQuick, button.dataset.entryId, button);
        });
      });
      els.viewHost.querySelectorAll("[data-select-entry]").forEach((button) => {
        button.addEventListener("click", () => toggleEntrySelection(button.dataset.selectEntry));
      });
      setupEntrySwipeControls();
      els.viewHost.querySelectorAll(".suggestion-card").forEach((button) => {
        button.addEventListener("click", () => {
          selectedSuggestionId = button.dataset.suggestionId;
          render();
        });
      });
      els.viewHost.querySelectorAll("[data-moment-suggestion]").forEach((button) => {
        button.addEventListener("click", () => startEntryFromSuggestion(button.dataset.momentSuggestion));
      });
      const titleInput = document.getElementById("entryTitleInput");
      const bodyInput = document.getElementById("entryBodyInput");
      titleInput?.addEventListener("input", markEditorDirty);
      bodyInput?.addEventListener("input", () => {
        markEditorDirty();
        updateMentionSuggestions();
      });
      els.viewHost.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => handleAction(button.dataset.action, button));
      });
      els.viewHost.querySelectorAll("[data-interest]").forEach((button) => {
        button.addEventListener("click", () => toggleInterest(button.dataset.interest, button));
      });
      els.viewHost.querySelectorAll("[data-permission]").forEach((button) => {
        button.addEventListener("click", () => togglePermission(button.dataset.permission, button));
      });
      els.viewHost.querySelectorAll("[data-backup-service]").forEach((button) => {
        button.addEventListener("click", () => selectBackupService(button.dataset.backupService, button));
      });
      els.viewHost.querySelectorAll("[data-social-login]").forEach((button) => {
        button.addEventListener("click", () => selectSocialLogin(button.dataset.socialLogin));
      });
      els.viewHost.querySelectorAll("[data-cover]").forEach((button) => {
        button.addEventListener("click", () => selectCover(button.dataset.cover, button));
      });
      els.viewHost.querySelectorAll("[data-photo-name]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          askPhotoSubjectName(button.dataset.photoName, button.dataset.regionId);
        });
      });
      els.viewHost.querySelectorAll("[data-remove-entry-photo]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          removePhotoFromCurrentEntry(button.dataset.removeEntryPhoto);
        });
      });
      els.viewHost.querySelectorAll("[data-mention-fill]").forEach((button) => {
        button.addEventListener("click", () => fillMention(button.dataset.mentionFill));
      });
      els.viewHost.querySelectorAll("[data-switch]").forEach((button) => {
        button.addEventListener("click", () => toggleSetting(button.dataset.switch));
      });
      els.viewHost.querySelectorAll("[data-setting-value]").forEach((button) => {
        button.addEventListener("click", () => setSettingValue(button.dataset.settingValue, button));
      });
      els.viewHost.querySelectorAll("[data-setting-input]").forEach((input) => {
        input.addEventListener("change", () => setSettingInput(input.dataset.settingInput, input.value, input));
        if (input.type === "range") input.addEventListener("input", () => setSettingInput(input.dataset.settingInput, input.value, input));
      });
      els.viewHost.querySelectorAll("[data-delete-place]").forEach((button) => button.addEventListener("click", () => deleteItem("places", button.dataset.deletePlace)));
      els.viewHost.querySelectorAll("[data-delete-photo]").forEach((button) => button.addEventListener("click", () => deleteItem("photos", button.dataset.deletePhoto)));
      els.viewHost.querySelectorAll("[data-delete-person]").forEach((button) => button.addEventListener("click", () => deleteItem("people", button.dataset.deletePerson)));
      els.viewHost.querySelectorAll("[data-delete-card]").forEach((button) => button.addEventListener("click", () => deleteItem("cards", button.dataset.deleteCard)));
      els.viewHost.querySelectorAll("[data-secure-view]").forEach((button) => button.addEventListener("click", async () => navigate(button.dataset.secureView)));
      els.viewHost.querySelectorAll("[data-photo-suggestion]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedSuggestionId = `photo:${button.dataset.photoSuggestion}`;
          activeView = "suggestions";
          render();
        });
      });
      const insightsGrid = document.getElementById("insightsGrid");
      insightsGrid?.querySelectorAll(".insight-card").forEach((card) => {
        card.addEventListener("click", () => {
          const expanded = card.classList.contains("expanded");
          insightsGrid.classList.toggle("has-expanded", !expanded);
          insightsGrid.querySelectorAll(".insight-card").forEach((item) => item.classList.remove("expanded"));
          if (!expanded) card.classList.add("expanded");
        });
      });
    }

    async function handleAction(action, source) {
      const actions = {
        "save-entry": () => saveCurrentEntry(),
        "new-entry": openMomentPicker,
        "new-blank-entry": startNewEntry,
        "close-editor": () => {
          if (editorDirty) saveCurrentEntry({ silent: true, openSetup: false });
          activeView = "entries";
          render();
        },
        "back-to-editor": () => {
          activeView = "editor";
          render();
        },
        "go-entries": () => {
          activeView = "entries";
          render();
        },
        "open-current-editor": () => {
          activeView = "editor";
          render();
        },
        "finish-entry-setup": finishEntrySetup,
        "ai-entry-metadata": aiEntryMetadata,
        "onboarding-next": onboardingNext,
        "onboarding-back": onboardingBack,
        "finish-onboarding": finishOnboarding,
        "restart-onboarding": () => {
          state.onboarding.completed = false;
          state.onboarding.step = 0;
          persistState();
          activeView = "onboarding";
          render();
        },
        "delete-entry": deleteCurrentEntry,
        "ai-write": aiWrite,
        "ai-edit": () => aiEdit("edit"),
        "ai-warm": () => aiEdit("warm"),
        "idea-for-selected": () => ideaForSelected(false),
        "write-selected": () => ideaForSelected(true),
        "refresh-suggestions": () => {
          suggestionSeed++;
          selectedSuggestionId = null;
          render();
        },
        "lucky-suggestions": () => {
          suggestionSeed++;
          selectedSuggestionId = null;
          showToast("Öneriler yenilendi", "casino");
          render();
        },
        "prompt-past": () => setPromptTab("past", source),
        "prompt-memories": () => setPromptTab("memories", source),
        "prompt-goals": () => setPromptTab("goals", source),
        "more-editor": () => openEditorToolsMenu(source),
        "new-from-suggestion": () => {
          const suggestion = getSelectedSuggestion();
          if (suggestion) startEntryFromSuggestion(suggestion.id);
          else startNewEntry();
        },
        "import-timeline": () => els.timelineInput.click(),
        "import-photos": () => els.photoInput.click(),
        "request-photo-library": requestPhotoLibrary,
        "connect-health": connectHealthData,
        "bulk-favorite": bulkFavoriteSelected,
        "bulk-delete": bulkDeleteSelected,
        "capture-location": captureLocation,
        "open-place-dialog": openPlaceDialog,
        "open-person-dialog": openPersonDialog,
        "open-card-dialog": openCardDialog,
        "save-profile": saveProfile,
        "setup-biometric": setupBiometric,
        "test-biometric": async () => {
          const ok = await requireBiometric("test");
          if (ok) showToast("Biyometrik doğrulama başarılı", "verified_user");
        },
        "analyze-vault": analyzeVaultWithAI,
        "extract-people": extractPeopleWithAI,

          toggleSettingPanel(source);
        },
        "test-ai": testAI,

          state.security.unlockedUntil = 0;
          persistState();
          showToast("Kasa kilitlendi", "lock");
        },

    function setupEntrySwipeControls() {
      els.viewHost.querySelectorAll(".entry-swipe").forEach((row) => {
        const front = row.querySelector(".entry-swipe-front");
        const entryId = row.dataset.swipeEntryId;
        let startX = 0;
        let currentX = 0;
        let dragging = false;
        let longPressTimer = null;

        front.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          els.viewHost.querySelectorAll(".entry-swipe").forEach((item) => {
            if (item !== row) {
              item.dataset.openX = "0";
              item.style.setProperty("--swipe-x", "0px");
            }
          });
          startX = event.clientX;
          currentX = Number(row.dataset.openX || 0);
          dragging = false;
          row.classList.add("dragging");
          longPressTimer = setTimeout(() => {
            front.dataset.suppressClick = "1";
            openEntryActionsMenu(front, entryId);
          }, 560);
          front.setPointerCapture?.(event.pointerId);
        });

        front.addEventListener("pointermove", (event) => {
          const delta = event.clientX - startX;
          if (Math.abs(delta) > 8) {
            dragging = true;
            clearTimeout(longPressTimer);
          }
          if (!dragging) return;
          const next = clamp(currentX + delta, -178, 0);
          row.style.setProperty("--swipe-x", `${next}px`);
        });

        front.addEventListener("pointerup", (event) => {
          clearTimeout(longPressTimer);
          row.classList.remove("dragging");
          const transform = getComputedStyle(front).transform;
          let x = 0;
          if (transform && transform !== "none") {
            const parts = transform.match(/matrix\(([^)]+)\)/)?.[1]?.split(",") || [];
            x = Number(parts[4] || 0);
          }
          const open = x < -72;
          row.dataset.openX = open ? "-178" : "0";
          row.style.setProperty("--swipe-x", open ? "-178px" : "0px");
          if (dragging) front.dataset.suppressClick = "1";
          front.releasePointerCapture?.(event.pointerId);
        });

        front.addEventListener("pointercancel", () => {
          clearTimeout(longPressTimer);
          row.classList.remove("dragging");
          row.style.setProperty("--swipe-x", row.dataset.openX === "-178" ? "-178px" : "0px");
        });

        front.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          front.dataset.suppressClick = "1";
          openEntryActionsMenu(front, entryId);
        });
      });
    }

    function extractTimelinePlaces(data) {
      const results = [];
      const seen = new Set();
      function pickLatLng(obj) {
        const candidates = [obj, obj.location, obj.placeLocation, obj.startLocation, obj.endLocation].filter(Boolean);
        for (const item of candidates) {
          let lat = item.latitudeE7 ?? item.latE7 ?? item.latitude ?? item.lat;
          let lng = item.longitudeE7 ?? item.lngE7 ?? item.longitude ?? item.lng ?? item.lon;
          if (typeof lat === "string") lat = Number(lat.replace("°", ""));
          if (typeof lng === "string") lng = Number(lng.replace("°", ""));
          if (Math.abs(lat) > 1000) lat = lat / 1e7;
          if (Math.abs(lng) > 1000) lng = lng / 1e7;
          if (Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng };
        }
        return null;
      }
      function pickName(obj) {
        const loc = obj.location || obj.placeLocation || {};
        return obj.name || obj.title || obj.placeName || loc.name || loc.address || obj.address || "Google Timeline konumu";
      }
      function pickTime(obj) {
        const duration = obj.duration || {};
        return obj.startTime || obj.timestamp || duration.startTimestamp || duration.startTime || obj.endTime || new Date().toISOString();
      }
      function visit(node) {
        if (!node || typeof node !== "object") return;
        if (!Array.isArray(node)) {
          const coords = pickLatLng(node);
          if (coords) {
            const name = pickName(node);
            const key = `${name}|${coords.lat.toFixed(5)}|${coords.lng.toFixed(5)}`;
            if (!seen.has(key)) {
              seen.add(key);
              results.push({ name, lat: coords.lat, lng: coords.lng, visitedAt: pickTime(node), source: "Google Timeline" });
            }
          }
        }
        Object.values(node).forEach(visit);
      }
      visit(data);
      return results.slice(0, 500);
    }

    async function importHealthFile(file) {
      const text = await file.text();
      let workouts = [];
      if (file.name.toLocaleLowerCase("tr-TR").endsWith(".csv")) {
        workouts = parseWorkoutCsv(text);
      } else {
        const json = JSON.parse(text);
        workouts = extractWorkoutsFromJson(json);
      }
      importHealthWorkouts(workouts);
    }

    function importHealthWorkouts(workouts = []) {
      const normalized = workouts.map(normalizeWorkout).filter(Boolean);
      const existing = new Set(state.healthWorkouts.map((item) => `${item.type}|${item.startAt}|${item.distanceKm || ""}`));
      normalized.forEach((workout) => {
        const key = `${workout.type}|${workout.startAt}|${workout.distanceKm || ""}`;
        if (!existing.has(key)) {
          existing.add(key);
          state.healthWorkouts.push(workout);
        }
      });
      persistState();
      selectedSuggestionId = null;
      showToast(`${normalized.length} sağlık aktivitesi eklendi`, "directions_run");
      render();
    }

    function normalizeWorkout(item) {
      if (!item || typeof item !== "object") return null;
      const startAt = item.startAt || item.startDate || item.date || item.timestamp || item.start || item.createdAt;
      if (!startAt) return null;
      const startDate = new Date(startAt);
      if (Number.isNaN(startDate.getTime())) return null;
      return {
        id: item.id || uid("workout"),
        type: item.type || item.workoutType || item.activityType || item.name || "workout",
        name: item.name || "",
        startAt: startDate.toISOString(),
        durationMinutes: Number(item.durationMinutes ?? item.duration ?? item.minutes ?? 0) || 0,
        distanceKm: Number(item.distanceKm ?? item.distance_km ?? item.distance ?? 0) || 0,
        calories: Number(item.calories ?? item.energy ?? 0) || 0,
        createdAt: new Date().toISOString()
      };
    }

    function extractWorkoutsFromJson(data) {
      if (Array.isArray(data)) return data;
      const candidates = data.workouts || data.activities || data.records || data.data || [];
      if (Array.isArray(candidates)) return candidates;
      const results = [];
      function visit(node) {
        if (!node || typeof node !== "object") return;
        if (!Array.isArray(node) && (node.workoutType || node.activityType || node.type === "workout" || node.type === "HKWorkout")) results.push(node);
        Object.values(node).forEach(visit);
      }
      visit(data);
      return results;
    }

    function parseWorkoutCsv(text) {
      const lines = text.split(/\r?\n/).filter((line) => line.trim());
      if (lines.length < 2) return [];
      const headers = lines[0].split(",").map((header) => header.trim());
      return lines.slice(1).map((line) => {
        const values = line.split(",");
        return Object.fromEntries(headers.map((header, index) => [header, values[index]?.trim() || ""]));
      });
    }

    function makeThumbnail(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const max = 900;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", .78));
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => resolve("");
        img.src = URL.createObjectURL(file);
      });
    }

    async function analyzePhotoSubject(photo) {
      if (!photo.thumb) return;
      if (!state.settings.apiKey) {
        const faceRegions = await detectFacesLocally(photo.thumb).catch(() => []);
        if (faceRegions.length) {
          photo.subjectRegions = faceRegions;
          photo.needsName = true;
          persistState();
        }
        return;
      }
      try {
        const knownNames = (state.subjects || []).map((subject) => subject.name).filter(Boolean).join(", ");
        const result = await callGeminiVision(photo.thumb, `Bu görselde görünen kişi, kedi, köpek veya belirgin evcil hayvanları bul. Kayıtlı isimler: ${knownNames || "yok"}. Eğer kayıtlı isimlerden biriyle aynı kişi/hayvan gibi görünüyorsa matchedName alanına o adı yaz; emin değilsen boş bırak. Duygu/ifade için kısa ve dikkatli moodHint yazabilirsin, örn. "mutlu gibisin" veya "sakin bir an gibi". Sadece JSON döndür: {"moodHint":"","subjects":[{"type":"person|cat|dog|pet|animal","matchedName":"","smile":false,"box":{"x":0.5,"y":0.4,"w":0.2,"h":0.3}}]}. x ve y kutunun merkez noktasıdır, tüm değerler 0 ile 1 arasında normalize olsun. Hiç yoksa {"subjects":[]} döndür.`);
        const parsed = parseLooseJson(result);
        const subjects = Array.isArray(parsed.subjects) ? parsed.subjects : [];
        if (subjects.length) {
          photo.moodHint = parsed.moodHint || photo.moodHint || "";
          photo.subjectRegions = subjects.slice(0, 8).map((subject) => ({
            id: uid("region"),
            type: subject.type || "subject",
            name: subject.matchedName || subject.name || "",
            smile: Boolean(subject.smile),
            x: clamp(Number(subject.box?.x ?? subject.x ?? .5), .08, .92),
            y: clamp(Number(subject.box?.y ?? subject.y ?? .22), .08, .92),
            w: clamp(Number(subject.box?.w ?? .18), .05, .9),
            h: clamp(Number(subject.box?.h ?? .22), .05, .9)
          }));
          photo.subjectType = photo.subjectRegions[0]?.type || "subject";
          photo.subjectName = photo.subjectRegions.find((region) => region.name)?.name || photo.subjectName || "";
          photo.smileHint = photo.subjectRegions.some((region) => region.smile);
          photo.needsName = photo.subjectRegions.some((region) => !region.name);
          persistState();
        } else {
          photo.needsName = false;
          persistState();
        }
      } catch (error) {
        const faceRegions = await detectFacesLocally(photo.thumb).catch(() => []);
        if (faceRegions.length) {
          photo.subjectRegions = faceRegions;
          photo.needsName = true;
          persistState();
        }
      }
    }

    async function callGeminiVision(dataUrl, prompt) {
      const bridge = getNativeBridge();
      if (state.permissions.nativeAI && bridge?.analyzeImage) {
        const output = await bridge.analyzeImage({ image: dataUrl, prompt });
        if (output) return String(output);
      }
      const apiKey = state.settings.apiKey.trim();
      if (!apiKey) throw new Error("Gemini API anahtarı eksik.");
      const mimeMatch = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
      if (!mimeMatch) throw new Error("Görsel okunamadı.");
      const selectedModel = state.settings.aiModel || "gemini-2.5-flash";
      const model = selectedModel.includes("3.5") ? "gemini-2.5-flash" : selectedModel;
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: mimeMatch[1], data: mimeMatch[2] } }
            ]
          }]
        })
      });
      if (!response.ok) throw new Error("Görsel analizi yapılamadı.");
      const data = await response.json();
      return data.candidates?.[0]?.content?.parts?.map((part) => part.text || "").join("\n").trim() || "";
    }

          id: uid("region"),
          type: "person",

          x: clamp((box.x + box.width / 2) / image.naturalWidth, .08, .92),
          y: clamp((box.y + box.height / 2) / image.naturalHeight, .08, .92),
          w: clamp(box.width / image.naturalWidth, .05, .9),
          h: clamp(box.height / image.naturalHeight, .05, .9)
        };
      });
    }

    function parseExifGps(buffer) {
      const view = new DataView(buffer);
      if (view.byteLength < 4 || view.getUint16(0, false) !== 0xffd8) return null;
      let offset = 2;
      while (offset < view.byteLength) {
        const marker = view.getUint16(offset, false);
        offset += 2;
        const length = view.getUint16(offset, false);
        offset += 2;
        if (marker === 0xffe1) {
          const header = readAscii(view, offset, 6);
          if (header !== "Exif\0\0") return null;
          return parseTiffGps(view, offset + 6);
        }
        offset += length - 2;
      }
      return null;
    }

    function parseTiffGps(view, tiffOffset) {
      const little = view.getUint16(tiffOffset, false) === 0x4949;
      const get16 = (offset) => view.getUint16(offset, little);
      const get32 = (offset) => view.getUint32(offset, little);
      const firstIfd = tiffOffset + get32(tiffOffset + 4);
      const firstTags = readIfd(view, firstIfd, tiffOffset, little);
      const gpsPointer = firstTags[0x8825]?.value;
      if (!gpsPointer) return null;
      const gpsTags = readIfd(view, tiffOffset + gpsPointer, tiffOffset, little);
      const latRef = gpsTags[1]?.ascii || "N";
      const latVal = gpsTags[2]?.rationals;
      const lngRef = gpsTags[3]?.ascii || "E";
      const lngVal = gpsTags[4]?.rationals;
      if (!latVal || !lngVal) return null;
      let lat = rationalToDegrees(latVal);
      let lng = rationalToDegrees(lngVal);
      if (latRef.toUpperCase().startsWith("S")) lat *= -1;
      if (lngRef.toUpperCase().startsWith("W")) lng *= -1;
      return { lat, lng };
    }

    function readIfd(view, offset, tiffOffset, little) {
      const get16 = (position) => view.getUint16(position, little);
      const get32 = (position) => view.getUint32(position, little);
      const count = get16(offset);
      const tags = {};
      for (let i = 0; i < count; i++) {
        const pos = offset + 2 + i * 12;
        const tag = get16(pos);
        const type = get16(pos + 2);
        const num = get32(pos + 4);
        const valueOffset = pos + 8;
        const dataOffset = num * typeSize(type) > 4 ? tiffOffset + get32(valueOffset) : valueOffset;
        if (type === 2) tags[tag] = { ascii: readAscii(view, dataOffset, num).replace(/\0/g, "") };
        else if (type === 5) {
          const rationals = [];
          for (let j = 0; j < num; j++) {
            const top = get32(dataOffset + j * 8);
            const bottom = get32(dataOffset + j * 8 + 4) || 1;
            rationals.push(top / bottom);
          }
          tags[tag] = { rationals };
        } else tags[tag] = { value: get32(valueOffset) };
      }
      return tags;
    }

    function typeSize(type) {
      return { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 }[type] || 1;
    }

    function readAscii(view, offset, length) {
      let out = "";
      for (let i = 0; i < length && offset + i < view.byteLength; i++) out += String.fromCharCode(view.getUint8(offset + i));
      return out;
    }

    function rationalToDegrees(values) {
      return values[0] + values[1] / 60 + values[2] / 3600;
    }

    function parseLooseJson(text) {

    function getBiometricEnvironment() {
      const ua = navigator.userAgent || "";
      const platform = /iPhone|iPad|iPod/i.test(ua)
        ? "Face ID / Touch ID"
        : /Windows/i.test(ua)
          ? "Windows Hello"
          : "Platform biyometrisi";
      const supported = Boolean(window.PublicKeyCredential && navigator.credentials);
      const secureOrigin = window.isSecureContext && location.protocol !== "file:";
      if (!supported) {
        return {
          ready: false,
          label: `${platform}: tarayıcı desteklemiyor`,
          message: "Bu tarayıcı Windows Hello / Face ID için gerekli WebAuthn passkey API'sini desteklemiyor."
        };
      }
      if (!secureOrigin) {
        return {
          ready: false,
          label: `${platform}: güvenli köken gerekli`,
          message: "Windows Hello / Face ID için uygulamayı HTTPS, localhost, PWA veya güvenli EXE WebView kökeninde aç. Çift tıklanan file:// HTML'de sistem biyometri penceresi genellikle açılmaz."
        };
      }
      return {
        ready: true,
        label: `${platform}: gerçek sistem doğrulaması`,
        message: `${platform} hazır. Hassas menüler açılırken sistem biyometri penceresi istenir.`
      };
    }

    async function assertBiometricReady() {
      const environment = getBiometricEnvironment();
      if (!environment.ready) throw new Error(environment.message);
      const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      if (!available) throw new Error("Bu cihazda platform doğrulayıcı kapalı ya da kayıtlı değil. Windows Hello / Face ID ayarlarından önce cihaz kilidini etkinleştir.");
      return environment;
    }

    async function setupBiometric() {
      try {
        const environment = await assertBiometricReady();
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const userId = crypto.getRandomValues(new Uint8Array(16));
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge.buffer,
            rp: { name: "Akıllı Günlük" },
            user: {
              id: userId.buffer,
              name: state.profile.email || "gunluk@local",
              displayName: state.profile.name || "Günlük Sahibi"
            },
            pubKeyCredParams: [
              { type: "public-key", alg: -7 },
              { type: "public-key", alg: -257 }
            ],
            authenticatorSelection: {
              authenticatorAttachment: "platform",
              userVerification: "required",
              residentKey: "preferred",
              requireResidentKey: false
            },
            timeout: 60000,
            attestation: "none",
            extensions: { credProps: true }
          }
        });
        if (!credential) throw new Error("Biyometrik kayıt tamamlanmadı.");
        state.security.credentialId = bufferToBase64Url(credential.rawId);
        state.security.userId = bufferToBase64Url(userId);
        state.security.enabled = true;
        state.security.platform = environment.label;
        state.security.createdAt = new Date().toISOString();
        state.security.unlockedUntil = Date.now() + state.settings.lockMinutes * 60000;
        persistState();
        showToast("Biyometrik kasa kuruldu", "lock");
        render();
      } catch (error) {
        openDialog({
          icon: "lock",
          title: "Biyometri başlatılamadı",
          body: `<strong>${escapeHtml(error.message)}</strong><br><br>Bu akış sahte değil: desteklenen ortamda doğrudan Windows Hello / Face ID penceresi çağrılır.`,
          raw: true,
          actions: [{ label: "Tamam", kind: "filled", onClick: closeDialog }]
        });
      }
    }

    async function requireBiometric(purpose = "kasa") {
      if (!state.settings.biometricRequired) return true;
      if (state.security.unlockedUntil && Date.now() < state.security.unlockedUntil) return true;
      if (!state.security.enabled || !state.security.credentialId) {
        openDialog({
          icon: "lock",
          title: "Biyometrik kasa kurulmalı",
          body: `${escapeHtml(purpose)} için Windows Hello / Face ID doğrulaması gerekiyor. Önce bu cihazda bir geçiş anahtarı oluşturacağım.`,
          actions: [
            { label: "Vazgeç", kind: "text", onClick: closeDialog },
            { label: "Kur", kind: "filled", onClick: async () => {
              closeDialog();
              await setupBiometric();
            }}
          ]
        });
        return false;
      }
      try {
        await assertBiometricReady();
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const credentialId = base64UrlToBuffer(state.security.credentialId);
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge: challenge.buffer,
            allowCredentials: [{ type: "public-key", id: credentialId }],
            userVerification: "required",
            timeout: 60000
          },
          mediation: "optional"
        });
        if (!assertion) throw new Error("Biyometrik doğrulama tamamlanmadı.");
        state.security.unlockedUntil = Date.now() + state.settings.lockMinutes * 60000;
        persistState();
        return true;
      } catch (error) {
        showToast(error.message || "Biyometrik doğrulama iptal edildi", "lock");
        return false;
      }
    }

    function bufferToBase64Url(buffer) {
      const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
      let binary = "";
      bytes.forEach((byte) => binary += String.fromCharCode(byte));
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function base64UrlToBuffer(value) {
      const base64 = value.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((value.length + 3) % 4);
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `${state.settings.backupName || "akilli-gunluk"}-${date}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("Yedek indirildi", "download");
    }

    async function restoreData(file) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      state = mergeDeep(cloneState(defaultState), parsed);
      persistState();
      showToast("Yedek yüklendi", "upload");
      render();
    }

    function confirmClearData() {
      openDialog({
        icon: "delete_forever",
        title: "Tüm yerel veri silinsin mi?",
        body: "Günlükler, konumlar, görseller, kişiler, kart etiketleri ve ayarlar bu tarayıcıdan kaldırılır.",
        actions: [
          { label: "Vazgeç", kind: "text", onClick: closeDialog },
          { label: "Sil", kind: "filled", onClick: () => {
            localStorage.removeItem(STORAGE_KEY);
            state = cloneState(defaultState);
            activeView = "entries";
            closeDialog();
            showToast("Veriler silindi", "delete_forever");
            render();
          }}
        ]
      });
    }

    function openDialog({ icon, title, body, actions = [], raw = false }) {
      els.dialogLayer.classList.add("open");
      els.dialogLayer.innerHTML = `
        <section class="dialog" role="dialog" aria-modal="true">
          <div class="dialog-head">
            <div class="dialog-title">
              <span class="material-symbols-rounded">${icon}</span>
              <span>${escapeHtml(title)}</span>
            </div>
            <button class="icon-button" data-dialog-close aria-label="Kapat"><span class="material-symbols-rounded">close</span></button>
          </div>
          <div class="dialog-content">${raw ? body : escapeHtml(body)}</div>
          <div class="dialog-actions" id="dialogActions"></div>
        </section>
      `;
      const actionHost = document.getElementById("dialogActions");
      actions.forEach((action) => {
        const button = document.createElement("button");
        button.className = action.kind === "filled" ? "filled-button" : action.kind === "tonal" ? "tonal-button" : "text-button";
        button.textContent = action.label;
        button.addEventListener("click", action.onClick);
        actionHost.appendChild(button);
      });
      els.dialogLayer.querySelector("[data-dialog-close]").addEventListener("click", closeDialog);
    }

    function closeDialog() {
      els.dialogLayer.classList.remove("open");
      els.dialogLayer.innerHTML = "";
    }

    document.addEventListener("pointerdown", addRipple);
    els.anchorMenuLayer.addEventListener("click", (event) => {
      if (event.target === els.anchorMenuLayer) closeAnchorMenu();
    });

    els.menuButton.addEventListener("click", () => {
      openDialog({
        icon: "search",
        title: "Günlüklerde ara",
        body: `<label class="form-field"><span>Arama</span><input id="searchInput" placeholder="Başlık, kişi, konum veya kelime"></label>`,
        raw: true,
        actions: [
          { label: "Kapat", kind: "text", onClick: closeDialog },
          { label: "Ara", kind: "filled", onClick: () => {
            const query = document.getElementById("searchInput").value.trim().toLocaleLowerCase("tr-TR");
            closeDialog();
            if (!query) return;
            const found = state.entries.find((entry) => `${entry.title} ${entry.displayName || ""} ${entry.body}`.toLocaleLowerCase("tr-TR").includes(query));
            if (found) viewEntry(found.id);
            else showToast("Eşleşen günlük bulunamadı", "search_off");
          }}
        ]
      });
    });
    els.sidebarScrim.addEventListener("click", closeSidebar);
    els.profileChip.addEventListener("click", () => navigate("profile"));
    els.homeMoreButton.addEventListener("click", () => openHomeMenu(els.homeMoreButton));
    els.newEntryButton.addEventListener("click", openMomentPicker);
    els.saveTopButton.addEventListener("click", () => saveCurrentEntry());
    els.quickLockButton.addEventListener("click", async () => {
      await navigate("profile");
    });
    els.menuList.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-view]");
      if (button) await navigate(button.dataset.view);
    });
    els.footerMenu.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-view]");
      if (button) await navigate(button.dataset.view);
    });
    els.bottomNav.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-bottom-view]");
      if (button) await navigate(button.dataset.bottomView);
    });
    els.timelineInput.addEventListener("change", async () => {
      const file = els.timelineInput.files?.[0];
      els.timelineInput.value = "";
      if (!file) return;
      try {
        await importTimelineFile(file);
      } catch (error) {
        showToast(error.message || "Timeline okunamadı", "error");
      }
    });
    els.photoInput.addEventListener("change", async () => {
      const files = [...(els.photoInput.files || [])];
      els.photoInput.value = "";
      if (files.length) await importPhotos(files);
    });
    els.healthInput.addEventListener("change", async () => {
      const file = els.healthInput.files?.[0];
      els.healthInput.value = "";
      if (!file) return;
      try {
        await importHealthFile(file);
      } catch (error) {
        showToast(error.message || "Sağlık verisi okunamadı", "error");
      }
    });
    els.restoreInput.addEventListener("change", async () => {
      const file = els.restoreInput.files?.[0];
      els.restoreInput.value = "";
      if (!file) return;
      try {
        await restoreData(file);
      } catch (error) {
        showToast(error.message || "Yedek yüklenemedi", "error");
      }
    });
    window.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        if (activeView === "editor") saveCurrentEntry();
      }
      if (event.key === "Escape") {
        closeDialog();
        closeAnchorMenu();
        closeSidebar();
      }
    });

    applySettings();
    registerPwa();
    activeView = state.onboarding.completed
      ? (state.currentView && !["editor", "entrySetup", "viewer", "onboarding", "momentPicker"].includes(state.currentView) ? state.currentView : "entries")
      : "onboarding";
    render();

    function registerPwa() {
      if (!("serviceWorker" in navigator)) return;
      if (!/^https?:$/.test(location.protocol)) return;
      navigator.serviceWorker.register("./akilli-gunluk-sw.js").catch(() => null);
    }
  </script>
</body>
</html>
